name: Security Audit

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Cargo Audit
    if: &run-unless-train-bundle ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'train/') && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["dirvine"]'), github.event.pull_request.user.login)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout ant-quic
        uses: actions/checkout@v5
        with:
          repository: saorsa-labs/ant-quic
          path: .deps/ant-quic

      - name: Checkout saorsa-gossip
        uses: actions/checkout@v5
        with:
          repository: saorsa-labs/saorsa-gossip
          path: .deps/saorsa-gossip

      - name: Setup dependency symlinks
        run: |
          ln -s "$(pwd)/.deps/ant-quic" ../ant-quic
          ln -s "$(pwd)/.deps/saorsa-gossip" ../saorsa-gossip

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  panic-check:
    name: Panic Scanner
    if: *run-unless-train-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make script executable
        run: chmod +x scripts/check-panics.sh

      - name: Test panic scanner on synthetic sources
        run: python3 scripts/test_check_panics.py

      - name: Run panic scanner
        run: ./scripts/check-panics.sh
