name: Release custody checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-controls:
    name: Release custody offline controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test build and release custody helpers
        run: |
          python3 -B .github/scripts/test_build_artifact_provenance.py -v
          python3 -B .github/scripts/test_release_artifact_custody.py -v
