# Disposable #574 fixed-pair diagnostic. NEVER MERGE. No release path.
name: Build
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed 40-hex suite diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  suite-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Establish private roots and fixed deadline
        run: |
          python3 - <<'PY'
          import os, re, tempfile, time
          from pathlib import Path
          assert re.fullmatch('[0-9a-f]{40}', os.environ['EXPECTED_COMMIT'])
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/574-suite-diagnostic'
          root = Path(tempfile.mkdtemp(prefix='suite574-', dir=os.environ['RUNNER_TEMP']))
          root.chmod(0o700)
          (root/'bin').mkdir()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'S574_ROOT={root}\nS574_SAFE={root}/safe\nS574_DEADLINE={time.monotonic()+115*60}\n')
          with open(os.environ['GITHUB_PATH'], 'a') as path:
              path.write(str(root/'bin')+'\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Guard exact source and frozen lock
        run: python3 scripts/ci/suite574.py prep "$S574_ROOT"
      - name: Install exact toolchain and checksum-verified Linux nextest
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          sudo -n apt-get update
          sudo -n apt-get install -y libasound2-dev libdbus-1-dev pkg-config
          curl -fsSL https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-unknown-linux-gnu.tar.gz -o "$S574_ROOT/nextest.tar.gz"
          echo "66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e  $S574_ROOT/nextest.tar.gz" > "$S574_ROOT/nextest.sha256"
          sha256sum --check "$S574_ROOT/nextest.sha256"
          tar -xzf "$S574_ROOT/nextest.tar.gz" -C "$S574_ROOT/bin" cargo-nextest
          "$S574_ROOT/bin/cargo-nextest" nextest --version
          cargo fetch --locked
      - name: Inert collector and routing controls
        run: |
          set -euo pipefail
          python3 scripts/ci/test_isolation_custody_collect.py
          python3 scripts/ci/test_nextest_reuse.py
          python3 scripts/ci/test_suite574.py
      - name: One fresh locked all-workspace binary set
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/target"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          python3 scripts/ci/suite574.py build "$S574_ROOT"
      - name: Fixed single-target then suite pair
        run: python3 scripts/ci/suite574.py pair "$S574_ROOT"
      - name: Collect closed accounting on every outcome
        id: collect
        if: always()
        run: python3 scripts/ci/suite574.py collect "$S574_ROOT" "$S574_SAFE"
      - name: Upload only eligible closed receipt
        if: always() && steps.collect.outputs.receipt_eligible == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: suite574-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.S574_SAFE }}/suite-diagnostic.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
