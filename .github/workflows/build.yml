# DISPOSABLE BRANCH-ONLY REPLACEMENT — #449 isolated runtime acceptance.
#
# This file replaces the registered `build.yml` on the disposable diagnostic
# branch `claude/449-runtime-diagnostic` ONLY, following the #535 pattern.
# GitHub exposes `workflow_dispatch` only for workflows present on the default
# branch, so a newly authored path cannot be dispatched; replacing an already
# registered workflow on a throwaway branch avoids merging a diagnostic
# workflow to main to register it. THIS BRANCH MUST NEVER BE MERGED.
#
# The original build.yml at this base is sha256
# 4b52be097b5b19bb3b51eb1eca98b79e9573dce21162eed6cf86798dfe2ae3ba and is
# restored by deleting this branch; main is untouched.
#
# push/pull_request triggers are REMOVED so an ordinary branch push cannot
# start a runtime job. Dispatch is the only entry point.
name: Build

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact 40-hex commit SHA this run must be executing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: 449-home-restart-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_VERSION: 1.95.0
      HARNESS_SHA256: 780a7ae5588a7135712d58060312bdba169acf9e879b4038f28580100df62608
      WRAPPER_SHA256: 2a0c2521c19d5054b6e77c995e1604e9e9e174208157bb4331b5b38783aedced
      WITNESS_SHA256: dbd753e24b3d082ed434813e575ed214aa70fd8d33b8872f70db1bedb5e0f5ec
      LOCK_FIXTURE_SHA256: 0fb99da96b7464b3a5a3bfac07031721f0064fc3f128739a3e1ae860107cfd9f
      X0X_RUNTIME_TIMEOUT_SECONDS: "900"

    steps:
      # The dispatch input is untrusted. It reaches the shell ONLY through an
      # environment variable, is never expression-interpolated into a `run:`
      # body, and must match the exact 40-lowercase-hex commit form before any
      # use. This is guard hardening, not a response to a known exploit.
      - name: Validate the requested commit format
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          case "$EXPECTED_HEAD" in
            *[!0-9a-f]* | "") echo "expected_head is not lowercase hex"; exit 1 ;;
          esac
          [ "${#EXPECTED_HEAD}" -eq 40 ] || {
            echo "expected_head must be exactly 40 characters"; exit 1; }
          printf 'validated expected_head=%s\n' "$EXPECTED_HEAD"

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false

      - name: Assert the checkout is the intended commit and is clean
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          [ "$head" = "$EXPECTED_HEAD" ] || {
            echo "HEAD $head != expected $EXPECTED_HEAD"; exit 1; }
          # GITHUB_SHA is what the workflow run itself resolved; a mismatch
          # means the run is not executing the commit that was authorized.
          [ "$GITHUB_SHA" = "$EXPECTED_HEAD" ] || {
            echo "GITHUB_SHA $GITHUB_SHA != expected $EXPECTED_HEAD"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "dirty checkout"; exit 1; }
          printf 'head=%s\ntree=%s\n' "$head" "$(git rev-parse 'HEAD^{tree}')"

      - name: Pin harness and unchanged wrapper bytes
        run: |
          set -euo pipefail
          check() { echo "$2  $1" | sha256sum -c - ; }
          check scripts/diagnostics/449-home-restart-acceptance.py "$HARNESS_SHA256"
          check scripts/ci/isolated-runtime.py "$WRAPPER_SHA256"
          check scripts/ci/isolation-witness.py "$WITNESS_SHA256"

      - name: Pure controls (no daemon, no network)
        run: python3 scripts/diagnostics/449-home-restart-acceptance.py --self-test

      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc -V
          cargo -V

      - name: Install the tracked lock fixture (no fresh resolution)
        run: |
          set -euo pipefail
          # Cargo.lock is gitignored, so a digest alone cannot reproduce the
          # graph and `generate-lockfile` would resolve a NEW one at run time.
          # The exact lock from the accepted #449 lane is tracked and installed
          # verbatim, so the run consumes a known graph.
          echo "$LOCK_FIXTURE_SHA256  ci/449-acceptance/Cargo.lock.fixture" | sha256sum -c -
          cp ci/449-acceptance/Cargo.lock.fixture Cargo.lock
          sha256sum Cargo.lock | tee lock-installed.txt

      - name: Validate the locked graph without resolving
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > cargo-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('cargo-metadata.json').read_text())
          pkgs = meta['packages']
          registry = 'registry+https://github.com/rust-lang/crates.io-index'
          foreign = sorted({p['source'] for p in pkgs
                            if p.get('source') and p['source'] != registry})
          assert not foreign, f'unexpected package sources: {foreign}'
          Path('lock-provenance.json').write_text(json.dumps({
              'package_count': len(pkgs),
              'workspace_members': sorted(meta['workspace_members']),
              'sources': sorted({p['source'] for p in pkgs if p.get('source')}),
          }, indent=2, sort_keys=True) + '\n')
          print(f'validated {len(pkgs)} packages')
          PY

      - name: Build binaries from the locked graph
        run: |
          set -euo pipefail
          cargo build --locked --release --bin x0xd --bin x0x
          sha256sum Cargo.lock | tee lock-after.txt
          diff <(cut -d' ' -f1 lock-installed.txt) <(cut -d' ' -f1 lock-after.txt) \
            || { echo "lock drifted during build"; exit 1; }
          sha256sum target/release/x0xd target/release/x0x | tee binaries.sha256
          { rustc -V; cargo -V; } | tee toolchain.txt

      - name: Isolated runtime acceptance (unchanged #535 wrapper is the boundary)
        run: |
          set -euo pipefail
          python3 scripts/ci/isolated-runtime.py \
            python3 scripts/diagnostics/449-home-restart-acceptance.py \
              --binary "$PWD/target/release/x0xd" \
              --cli    "$PWD/target/release/x0x" \
              --evidence "$RUNNER_TEMP/449-evidence"

      - name: Assert wrapper isolation and cancellation receipts
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=("$RUNNER_TEMP"/x0x-isolation-*)
          [ ${#dirs[@]} -eq 1 ] || { echo "expected exactly one isolation dir"; exit 1; }
          for f in admission.json exit.json supervisor.json; do
            [ -f "${dirs[0]}/$f" ] || { echo "missing wrapper receipt $f"; exit 1; }
          done
          python3 - "${dirs[0]}" <<'PY'
          import json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          adm = json.loads((d / 'admission.json').read_text())
          assert [l['ifname'] for l in adm['links']] == ['lo'], adm['links']
          for rows in adm['routes'].values():
              for row in rows:
                  assert row.get('dev') == 'lo' and row.get('dst') != 'default', row
          sup = json.loads((d / 'supervisor.json').read_text())
          assert sup['child_reaped'] is True, sup
          assert sup['reason'] is None, f"run was cancelled: {sup['reason']}"
          print('isolation receipts ok')
          PY

      - name: Collect allowlisted receipts only
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/449-upload"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/449-evidence/449-acceptance.json" "$out/" || true
          for f in admission.json exit.json supervisor.json; do
            cp "$RUNNER_TEMP"/x0x-isolation-*/"$f" "$out/" || true
          done
          cp lock-installed.txt lock-provenance.json binaries.sha256 toolchain.txt "$out/" || true
          # Explicit refusal: no daemon logs, data roots, sidecars or tokens.
          find "$out" -type f -print

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 449-acceptance-receipts
          path: ${{ runner.temp }}/449-upload
          if-no-files-found: error
          retention-days: 7
