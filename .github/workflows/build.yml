# Temporary branch-only #531 diagnostic. Do not merge this variant into main.
name: 531 isolated diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      DIAG_ARTIFACTS: ${{ runner.temp }}/x0x-531-evidence
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, original CI
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@ef6302df50adb496d123b03ae2b53322d688ffa1
        with:
          tool: nextest@0.9.143
      - name: Prepare tools, verify source and build pinned archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 util-linux python3-yaml
          python3 -m unittest discover -s .github/diagnostics/531 -p 'test_*.py' -v
          python3 .github/diagnostics/531/diagnostic.py prepare "$DIAG_ARTIFACTS"
      - name: Validate fence and run exactly one diagnostic
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net --mount --pid --fork --mount-proc --ipc --kill-child=KILL \
            bash .github/diagnostics/531/namespace.sh \
            "$(id -u)" "$(id -g)" "$PWD" "$DIAG_ARTIFACTS" "$(command -v cargo-nextest)" \
            "$(readlink /proc/self/ns/net)"
      - name: Assemble explicit evidence whitelist
        id: collect
        if: always()
        run: python3 .github/diagnostics/531/diagnostic.py collect "$DIAG_ARTIFACTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.collect.outcome == 'success'
        with:
          name: diagnostic-531-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/x0x-531-evidence/upload/
          if-no-files-found: error
          retention-days: 14
