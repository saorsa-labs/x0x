# Disposable Home onboarding acceptance. Never merge this workflow to main.
name: Build
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed 40-hex diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Establish job deadline and private receipt roots
        run: |
          python3 - <<'PY'
          import json, os, re, tempfile, time
          from pathlib import Path
          assert re.fullmatch('[0-9a-f]{40}', os.environ['EXPECTED_COMMIT'])
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          assert run_id.isdigit() and attempt.isdigit()
          root = Path(tempfile.mkdtemp(prefix='home-onboarding-', dir=os.environ['RUNNER_TEMP']))
          raw, safe = root / 'raw', root / 'safe'
          raw.mkdir(mode=0o700)
          deadline = time.monotonic() + 27 * 60
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'HOME_RUN_ROOT={root}\nHOME_RAW={raw}\nHOME_SAFE={safe}\n')
              stream.write(f'HOME_OUTER_DEADLINE={deadline}\n')
              stream.write(f'HOME_RUN_NONCE={run_id}:{attempt}\n')
          (root / 'clock.json').write_text(json.dumps({
              'outer_deadline_monotonic': deadline, 'runtime_seconds': 900,
              'wrapper_allowance_seconds': 15, 'planned_collection_reserve_seconds': 180,
          }) + '\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify reviewed source and install frozen lock
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA'] == os.environ['EXPECTED_COMMIT']
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          expected = {
            'tests/home_onboarding_isolated.rs': 'e31cdfe80d088bb0b65dda264f431f18ae3357cd6667fcb874cc23dc2c59c148',
            'scripts/ci/isolated-runtime.py': '2a0c2521c19d5054b6e77c995e1604e9e9e174208157bb4331b5b38783aedced',
            'scripts/ci/isolation-witness.py': 'dbd753e24b3d082ed434813e575ed214aa70fd8d33b8872f70db1bedb5e0f5ec',
            'scripts/ci/nextest-reuse.py': '33a86e237d5ae5fb6d3ce694ccc5d92df08508068649216dd79a9048eb14596f',
            'scripts/ci/home-onboarding-collect.py': 'ab18ac2d032868d82d82c644112ff8fe4e00be9e16b6ff0029b53fc1650ca258',
            'scripts/ci/home-onboarding-collect-controls.py': '7e9eb30488a677fee71a8d3f495a4b451ba192dbefac80e1c68bb47c46f08689',
            'ci/home-onboarding/Cargo.lock.fixture': '83fc5316716b6240ffa470daa77d3e6a7ea9ed09baf6631320d472514e38b32f',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          assert not Path('Cargo.lock').exists()
          Path('Cargo.lock').write_bytes(Path('ci/home-onboarding/Cargo.lock.fixture').read_bytes())
          root = Path(os.environ['HOME_RUN_ROOT'])
          (root / 'source.json').write_text(json.dumps({
              'schema': 1, 'head': head,
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'files': expected, 'unchanged': True,
          }) + '\n')
          PY
      - name: Install pinned toolchain and build prerequisites
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
          cargo install cargo-nextest --version 0.9.126 --locked
          cargo fetch --locked
      - name: Run offline collector controls and synthetic isolation witness
        run: |
          set -euo pipefail
          python3 scripts/ci/home-onboarding-collect-controls.py
          python3 -m py_compile scripts/ci/home-onboarding-collect.py scripts/ci/home-onboarding-collect-controls.py
          python3 scripts/ci/isolation-witness.py
      - name: Fresh locked binaries-only build and custody
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/home-onboarding-target"
          test ! -e "$CARGO_TARGET_DIR"
          scratch="$RUNNER_TEMP/home-onboarding-metadata"
          mkdir -m 700 "$scratch"
          cargo metadata --format-version 1 --all-features --locked --offline > "$scratch/cargo.json"
          cargo nextest list --all-features --test home_onboarding_isolated --locked --offline \
            --cargo-metadata "$scratch/cargo.json" --list-type binaries-only \
            --message-format json > "$scratch/binaries.json"
          python3 scripts/ci/nextest-reuse.py record "$scratch"
          python3 - "$scratch" <<'PY'
          import hashlib, json, os, pathlib, stat, sys
          scratch, root = pathlib.Path(sys.argv[1]), pathlib.Path(os.environ['HOME_RUN_ROOT'])
          value = json.loads((scratch / 'binaries.json').read_text())
          meta = value['rust-build-meta']; target = pathlib.Path(meta['target-directory'])
          tests = [pathlib.Path(row['binary-path']) for row in value['rust-binaries'].values()
                   if row.get('binary-name') == 'home_onboarding_isolated' and row.get('kind') == 'test']
          rows = [row for group in meta['non-test-binaries'].values() for row in group]
          def one(name):
              found = [target / row['path'] for row in rows
                       if row.get('name') == name and row.get('kind') == 'bin-exe']
              assert len(found) == 1, (name, found)
              return found[0].resolve(strict=True)
          assert len(tests) == 1
          paths = {'x0xd': one('x0xd'), 'x0x': one('x0x'),
                   'home_onboarding_isolated': tests[0].resolve(strict=True)}
          binaries = {}
          for name, path in paths.items():
              assert path.is_file() and path.stat().st_mode & stat.S_IXUSR
              binaries[name] = {'path': str(path),
                  'pre_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'post_sha256': None}
          (root / 'build.json').write_text(json.dumps({
              'schema': 1, 'lock_sha256': hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest(),
              'cargo_metadata_sha256': hashlib.sha256((scratch / 'cargo.json').read_bytes()).hexdigest(),
              'binaries_metadata_sha256': hashlib.sha256((scratch / 'binaries.json').read_bytes()).hexdigest(),
              'custody_sha256': hashlib.sha256((scratch / 'custody.json').read_bytes()).hexdigest(),
              'binaries': binaries, 'fresh_target': True, 'unchanged': False,
          }) + '\n')
          (root / 'runtime.json').write_text(json.dumps({
              'schema': 1, 'wrapper_exit': 125, 'wrapper_evidence': None,
              'selector': 'test(=home_onboarding_single_announce_restart)',
              'target': 'home_onboarding_isolated', 'no_tests_fail': True,
          }) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'HOME_SCRATCH={scratch}\n')
              for name, path in paths.items(): stream.write(f'HOME_BIN_{name.upper()}={path}\n')
          PY
      - name: One isolated Home acceptance execution
        id: runtime
        run: |
          python3 - <<'PY'
          import hashlib, json, os, runpy, subprocess, time
          from pathlib import Path
          root, raw = Path(os.environ['HOME_RUN_ROOT']), Path(os.environ['HOME_RAW'])
          build = json.loads((root / 'build.json').read_text())
          unchanged = True
          for item in build['binaries'].values():
              item['post_sha256'] = hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()
              unchanged &= item['post_sha256'] == item['pre_sha256']
          build['unchanged'] = unchanged
          (root / 'build.json').write_text(json.dumps(build) + '\n')
          source = json.loads((root / 'source.json').read_text())
          source['unchanged'] = all(hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest
                                    for name, digest in source['files'].items())
          source['unchanged'] &= hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest() == build['lock_sha256']
          (root / 'source.json').write_text(json.dumps(source) + '\n')
          runtime = json.loads((root / 'runtime.json').read_text())
          if not unchanged or not source['unchanged']:
              runtime['wrapper_exit'] = 126
              (root / 'runtime.json').write_text(json.dumps(runtime) + '\n')
              raise SystemExit(126)
          deadline = runpy.run_path('scripts/ci/home-onboarding-collect.py')['admission_deadline_exit']
          deadline_exit = deadline(float(os.environ['HOME_OUTER_DEADLINE']) - time.monotonic())
          if deadline_exit is not None:
              runtime['wrapper_exit'] = deadline_exit
              (root / 'runtime.json').write_text(json.dumps(runtime) + '\n')
              raise SystemExit(deadline_exit)
          argv = ['python3', 'scripts/ci/isolated-runtime.py', '/usr/bin/env',
              f"X0X_TEST_X0XD_BIN={os.environ['HOME_BIN_X0XD']}",
              f"X0X_TEST_X0X_BIN={os.environ['HOME_BIN_X0X']}",
              f"X0X_TEST_HOME_RECEIPT={root / 'test-diagnostic.json'}",
              f"X0X_TEST_RUN_NONCE={os.environ['HOME_RUN_NONCE']}",
              f"X0X_TEST_SOURCE_HEAD={source['head']}",
              f"X0X_TEST_SOURCE_TREE={source['tree']}",
              'NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1',
              'python3', 'scripts/ci/nextest-reuse.py', 'run', os.environ['HOME_SCRATCH'],
              '--run-ignored', 'ignored-only', '--test-threads', '1', '--no-tests', 'fail',
              '--message-format', 'libtest-json-plus', '--message-format-version', '0.1',
              '-E', 'test(=home_onboarding_single_announce_restart)']
          with (raw / 'nextest.log').open('wb') as output, \
               (raw / 'nextest.stderr').open('wb') as error:
              result = subprocess.run(argv, stdout=output, stderr=error,
                  env={**os.environ, 'X0X_RUNTIME_TIMEOUT_SECONDS': '900'})
          rows = [line.split(': ', 1)[1] for line in (raw / 'nextest.log').read_text().splitlines()
                  if line.startswith('Isolation evidence: ')]
          projection = runpy.run_path('scripts/ci/home-onboarding-collect.py')
          nextest = projection['nextest_receipt_from_lines'](
              (raw / 'nextest.log').read_text().splitlines())
          (root / 'nextest.json').write_text(json.dumps(nextest) + '\n')
          runtime.update(wrapper_exit=result.returncode,
                         wrapper_evidence=rows[0] if len(rows) == 1 else None)
          (root / 'runtime.json').write_text(json.dumps(runtime) + '\n')
          unchanged = True
          for item in build['binaries'].values():
              item['post_sha256'] = hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()
              unchanged &= item['post_sha256'] == item['pre_sha256']
              item.pop('path')
          build['unchanged'] = unchanged
          (root / 'build.json').write_text(json.dumps(build) + '\n')
          source = json.loads((root / 'source.json').read_text())
          source['unchanged'] = all(hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest
                                    for name, digest in source['files'].items())
          source['unchanged'] &= hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest() == build['lock_sha256']
          (root / 'source.json').write_text(json.dumps(source) + '\n')
          if not unchanged or not source['unchanged']: raise SystemExit(126)
          raise SystemExit(result.returncode)
          PY
      - name: Collect closed privacy-safe receipts
        id: collect
        if: always()
        run: |
          python3 scripts/ci/home-onboarding-collect.py \
            --root "$HOME_RUN_ROOT" --safe "$HOME_SAFE" --runner-temp "$RUNNER_TEMP" \
            --run-nonce "$HOME_RUN_NONCE"
      - name: Enforce semantic acceptance
        if: always() && steps.collect.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          outcome = json.loads((Path(os.environ['HOME_SAFE']) / 'outcome.json').read_text())
          assert outcome == {'accepted': True, 'failure_stage': 'none', 'schema': 1}, outcome
          PY
      - name: Upload closed Home receipts
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: home-onboarding-${{ github.run_id }}
          path: ${{ env.HOME_SAFE }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
