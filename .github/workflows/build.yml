name: 703 Caller-and-Adapter Optimized Test Profile 100k Diagnostic

# Diagnostic-only workflow on the #703 test-signing-profile branch.
# Manual dispatch only — no push/PR triggers, no release/build matrix,
# no uploads other than the test proof/logs. This replaces the default
# build.yml ONLY on this dedicated branch; default branch is untouched.
# Unlike the earlier release-mode diagnostic, this keeps the plain cargo
# test command (no --release) while fips204, its concrete saorsa-pqc and
# ant-quic signing adapters, AND the x0x test target itself (authorized
# upper control) receive package opt-level=3 via [profile.test.package.*].

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  run-703-caller-and-adapter-optimized-test-profile-100k:
    name: Exact 100k test, caller-and-adapter optimized test profile, loopback netns
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # No cargo cache restore: fresh HOME/caches on the ephemeral runner,
      # matching the plan's fresh-cache requirement.

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install Linux perf tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes linux-tools-common linux-tools-generic

      - name: Verify tree and run exact 100k test with caller-and-adapter optimized profile
        run: |
          python3 scripts/ci/run-703-optimized.py \
            --repo "$GITHUB_WORKSPACE" \
            --artifact-dir "$RUNNER_TEMP/703-artifacts"

      - name: Upload proof and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: 703-caller-and-adapter-optimized-test-profile-proof
          path: |
            ${{ runner.temp }}/703-artifacts/run-report.json
            ${{ runner.temp }}/703-artifacts/inner-result.json
            ${{ runner.temp }}/703-artifacts/proof.json
            ${{ runner.temp }}/703-artifacts/test.log
            ${{ runner.temp }}/703-artifacts/build-messages.json
            ${{ runner.temp }}/703-artifacts/build-stderr.log
            ${{ runner.temp }}/703-artifacts/perf-precheck.json
            ${{ runner.temp }}/703-artifacts/perf.data
            ${{ runner.temp }}/703-artifacts/perf-report-self.txt
            ${{ runner.temp }}/703-artifacts/perf-report-children.txt
            ${{ runner.temp }}/703-artifacts/perf-observer.log
          if-no-files-found: warn
