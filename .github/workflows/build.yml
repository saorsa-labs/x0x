name: CI isolation synthetic admission
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  isolation-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify exact diagnostic source
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, re, subprocess
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['EXPECTED_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', expected) and head == expected
          paths = sorted(pathlib.Path('scripts/ci').glob('*'))
          print(json.dumps({'head': head, 'scripts': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths if p.is_file()}}, indent=2))
          PYCODE
      - name: Run synthetic namespace controls only
        run: python3 scripts/ci/isolation-witness.py
      - name: Retain bounded isolation receipts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: isolation-synthetic-evidence
          path: |
            ${{ runner.temp }}/x0x-isolation-*/*.json
            ${{ runner.temp }}/x0x-witness-total-*/*.json
            ${{ runner.temp }}/x0x-cancel-witness-*/*.stdout
            ${{ runner.temp }}/x0x-cancel-witness-*/*.stderr
          if-no-files-found: warn
