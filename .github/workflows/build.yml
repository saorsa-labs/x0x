# Disposable #491 RT3 diagnostic only. Never merge this workflow to main.
name: Build
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed 40-hex diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  rt3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      X0X_RUNTIME_TIMEOUT_SECONDS: 900
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Validate input and reserve runtime and receipt budget
        run: |
          python3 - <<'PY'
          import json, os, re, tempfile, time
          from pathlib import Path
          assert re.fullmatch('[0-9a-f]{40}', os.environ['EXPECTED_COMMIT'])
          root = Path(tempfile.mkdtemp(prefix='rt3-hosted-', dir=os.environ['RUNNER_TEMP']))
          assert not root.is_relative_to('/tmp')
          raw, safe = root / 'raw', root / 'safe'
          raw.mkdir(mode=0o700); safe.mkdir(mode=0o700)
          deadline = time.monotonic() + 27 * 60
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'RT3_ROOT={root}\nRT3_RAW={raw}\nRT3_SAFE={safe}\n')
              stream.write(f'RT3_OUTER_DEADLINE={deadline}\n')
          (root / 'clock.json').write_text(json.dumps({
              'outer_deadline_monotonic': deadline, 'runtime_budget_seconds': 900,
              'wrapper_overhead_allowance_seconds': 15,
              'planned_receipt_reserve_seconds': 180,
          }) + '\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify source and install exact tracked lock
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA'] == os.environ['EXPECTED_COMMIT']
          assert not subprocess.check_output(
              ['git', 'status', '--porcelain', '--untracked-files=all'], text=True
          )
          expected = {
              'Cargo.toml': '35ff49e689d025a98e7001e559e0a6903daaac8c6bc2f2c1da26168814677e46',
              'src/bin/rt3_fixture.rs':
                  '5d14ba7f926dd70a59305632d50c25be5d0e6fe00dc9824f69f744c3f052e1bd',
              'tests/rt3_harness.py':
                  'b0211a4fd1d8a90e6532a42e926543d15f6fc03b6b61e639abab9fc11daf7566',
              'tests/rt3_harness_controls.py':
                  '45b885846a1ba5fa240cc35aa2ca27ec6fe86dd86ce0d905eadb087478923d32',
              'scripts/ci/isolated-runtime.py':
                  '2a0c2521c19d5054b6e77c995e1604e9e9e174208157bb4331b5b38783aedced',
              'scripts/ci/isolation-witness.py':
                  'dbd753e24b3d082ed434813e575ed214aa70fd8d33b8872f70db1bedb5e0f5ec',
              'ci/491-rt3/Cargo.lock.fixture':
                  '5769726f49c34214f818a9c21e435cfabe02ba5efc1e47a62d6b888c1ee6f9c2',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          assert not Path('Cargo.lock').exists(), 'refuse preexisting lock'
          Path('Cargo.lock').write_bytes(Path('ci/491-rt3/Cargo.lock.fixture').read_bytes())
          (Path(os.environ['RT3_ROOT']) / 'source.json').write_text(json.dumps({
              'head': head,
              'tree': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD^{tree}'], text=True
              ).strip(),
              'files': expected,
          }, indent=2) + '\n')
          PY
      - name: Install exact Rust toolchain and build prerequisites
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - name: Build fresh locked daemon CLI and typed witness
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root, target = Path(os.environ['RT3_ROOT']), Path.cwd() / 'target'
          target.mkdir(mode=0o700)
          env = {**os.environ, 'CARGO_TARGET_DIR': str(target)}
          metadata = subprocess.check_output([
              'cargo', 'metadata', '--locked', '--features', 'rt3-diagnostic',
              '--format-version', '1'
          ], env=env)
          meta = json.loads(metadata)
          package = next(item for item in meta['packages']
                         if item['manifest_path'] == str(Path.cwd() / 'Cargo.toml'))
          argv = [
              'cargo', 'build', '--locked', '--features', 'rt3-diagnostic',
              '--bin', 'x0xd', '--bin', 'x0x', '--bin', 'rt3_fixture',
              '--message-format=json'
          ]
          with (root / 'build.jsonl').open('wb') as output, (
              root / 'build.stderr'
          ).open('wb') as error:
              build = subprocess.run(argv, env=env, stdout=output, stderr=error)
          record = {
              'argv': argv, 'exit': build.returncode, 'target': str(target),
              'rustc': subprocess.check_output(['rustc', '-Vv'], text=True),
              'cargo': subprocess.check_output(['cargo', '-V'], text=True),
              'binaries': {},
          }
          assert build.returncode == 0, 'locked build failed; no runtime'
          rows = [json.loads(line) for line in (root / 'build.jsonl').read_text().splitlines()
                  if line.startswith('{')]
          for name in ('x0xd', 'x0x', 'rt3_fixture'):
              selected = [row for row in rows
                          if row.get('reason') == 'compiler-artifact'
                          and row.get('package_id') == package['id']
                          and row.get('target', {}).get('name') == name]
              assert len(selected) == 1 and selected[0]['fresh'] is False, name
              row, binary = selected[0], target / 'debug' / name
              assert row['executable'] == str(binary)
              assert row['manifest_path'] == package['manifest_path']
              assert binary.is_file() and os.access(binary, os.X_OK)
              record['binaries'][name] = {
                  'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                  'cargo': row,
              }
          lock = hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest()
          assert lock == '5769726f49c34214f818a9c21e435cfabe02ba5efc1e47a62d6b888c1ee6f9c2'
          record['lock_sha256'] = lock
          record['packages'] = sorted([
              {'name': item['name'], 'version': item['version'], 'source': item['source']}
              for item in meta['packages']
          ], key=lambda item: (item['name'], item['version']))
          (root / 'build.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Run inert witness and harness controls
        run: |
          set -euo pipefail
          cargo test --locked --features rt3-diagnostic --bin rt3_fixture
          python3 tests/rt3_harness_controls.py
          python3 -m py_compile tests/rt3_harness.py tests/rt3_harness_controls.py
          python3 scripts/ci/isolation-witness.py
      - name: One whole-harness namespace execution
        id: runtime
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time
          from pathlib import Path
          root, raw = Path(os.environ['RT3_ROOT']), Path(os.environ['RT3_RAW'])
          assert float(os.environ['RT3_OUTER_DEADLINE']) - time.monotonic() >= 915, (
              'no full 900-second runtime plus wrapper allowance remains'
          )
          record = json.loads((root / 'build.json').read_text())
          for name, item in record['binaries'].items():
              assert hashlib.sha256(Path('target/debug', name).read_bytes()).hexdigest() == item['sha256']
          argv = [
              'python3', 'scripts/ci/isolated-runtime.py',
              'python3', str(Path('tests/rt3_harness.py').resolve()),
              '--run', '--artifacts', str(raw),
              '--x0xd', str(Path('target/debug/x0xd').resolve()),
              '--x0x', str(Path('target/debug/x0x').resolve()),
              '--fixture', str(Path('target/debug/rt3_fixture').resolve()),
          ]
          with (root / 'wrapper.stdout').open('wb') as output, (
              root / 'wrapper.stderr'
          ).open('wb') as error:
              result = subprocess.run(argv, stdout=output, stderr=error)
          rows = [line.split(': ', 1)[1]
                  for line in (root / 'wrapper.stdout').read_text().splitlines()
                  if line.startswith('Isolation evidence: ')]
          wrapper_evidence = rows[0] if len(rows) == 1 else None
          source = json.loads((root / 'source.json').read_text())
          unchanged = all(hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest
                          for name, digest in source['files'].items())
          unchanged = unchanged and hashlib.sha256(
              Path('Cargo.lock').read_bytes()).hexdigest() == record['lock_sha256']
          (root / 'runtime.json').write_text(json.dumps({
              'harness_exit': result.returncode, 'source_unchanged': unchanged,
              'wrapper_evidence': wrapper_evidence,
          }) + '\n')
          if not unchanged:
              raise SystemExit('source/lock custody changed')
          raise SystemExit(result.returncode)
          PY
      - name: Collect privacy-safe receipts
        id: collect
        if: always() && steps.runtime.outcome != 'skipped'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root, raw, safe = (Path(os.environ[name])
                             for name in ('RT3_ROOT', 'RT3_RAW', 'RT3_SAFE'))
          runtime = json.loads((root / 'runtime.json').read_text())
          wrapper_value = runtime.get('wrapper_evidence')
          assert isinstance(wrapper_value, str)
          wrapper = Path(wrapper_value).resolve()
          assert wrapper.is_relative_to(Path(os.environ['RUNNER_TEMP']).resolve())
          assert not wrapper.is_symlink()
          receipt_presence = {}
          for name in ('admission.json', 'exit.json', 'supervisor.json'):
              path = wrapper / name
              assert not path.is_symlink()
              receipt_presence[name] = path.is_file()
              if not path.is_file():
                  continue
              value = json.loads(path.read_text())
              if name == 'admission.json':
                  sanitized = {
                      'namespace_changed': isinstance(value.get('namespace'), str),
                      'interfaces_loopback_only':
                          [row.get('ifname') for row in value.get('links', [])] == ['lo'],
                      'routes_loopback_only': all(
                          row.get('dev') == 'lo' and row.get('dst') != 'default'
                          and 'gateway' not in row
                          for routes in value.get('routes', {}).values() for row in routes
                      ),
                      'capabilities_empty': all(
                          int(bits, 16) == 0
                          for bits in value.get('capabilities', {}).values()
                      ),
                      'no_new_privs': value.get('no_new_privs') == 1,
                  }
              elif name == 'exit.json':
                  sanitized = {'exit': value.get('exit')}
              else:
                  sanitized = {
                      'reason': value.get('reason'),
                      'child_exit': value.get('child_exit'),
                      'child_reaped': value.get('child_reaped'),
                  }
              (safe / name).write_text(json.dumps(sanitized, sort_keys=True) + '\n')
          (safe / 'runtime.json').write_text(json.dumps({
              'harness_exit': runtime.get('harness_exit'),
              'source_unchanged': runtime.get('source_unchanged'),
          }, sort_keys=True) + '\n')
          source, build = (json.loads((root / name).read_text())
                           for name in ('source.json', 'build.json'))
          (safe / 'source.json').write_text(json.dumps(source, indent=2) + '\n')
          (safe / 'build.json').write_text(json.dumps({
              'exit': build['exit'], 'lock_sha256': build['lock_sha256'],
              'rustc': build['rustc'], 'cargo': build['cargo'],
              'binaries': {name: {'sha256': item['sha256']}
                           for name, item in build['binaries'].items()},
              'packages': build['packages'],
          }, indent=2) + '\n')
          stages = {
              'prerequisites', 'identity', 'fixture_start', 'fixture_identity',
              'fixture_announce', 'fixture_create', 'fixture_join', 'fixture_converge',
              'fixture_witness', 'fixture_shutdown', 'split', 'lane_compare',
              'positive_start', 'positive_precheck', 'positive_hydrate', 'positive_seal',
              'positive_shutdown', 'negative_start', 'negative_precheck', 'negative_hydrate',
              'negative_seal', 'negative_shutdown',
              'complete',
          }
          error_classes = {
              'none', 'assertion', 'filesystem', 'http', 'process', 'timeout', 'unexpected'
          }
          outcome_path = raw / 'harness-outcome.json'
          assert not outcome_path.is_symlink()
          outcome = None
          if outcome_path.is_file():
              outcome = json.loads(outcome_path.read_text())
              assert set(outcome) == {
                  'schema', 'stage', 'status', 'error_class', 'error_line',
                  'cleanup_complete', 'children', 'observations', 'accepted',
              }
              assert outcome['schema'] == 1 and outcome['stage'] in stages
              assert type(outcome['status']) is int and 0 <= outcome['status'] <= 255
              assert outcome['error_class'] in error_classes
              assert type(outcome['error_line']) is int and outcome['error_line'] >= 0
              assert type(outcome['cleanup_complete']) is bool
              assert type(outcome['accepted']) is bool
              expected_observations = {
                  'same_owner', 'distinct_agents', 'distinct_machines',
                  'fixture_converged', 'cache_witness', 'lane_difference_cache_only',
                  'lane_identity_preserved',
                  'positive_hydration_status', 'positive_hydration_revision_increment',
                  'positive_hydration_roster_unchanged', 'positive_description_updated',
                  'positive_seal_status', 'positive_seal_revision_increment',
                  'positive_seal_roster_unchanged', 'positive_no_eviction',
                  'negative_hydration_status', 'negative_hydration_pending_class',
                  'negative_hydration_state_unchanged', 'negative_seal_status',
                  'negative_seal_pending_class', 'negative_seal_state_unchanged',
                  'negative_sidecar_unchanged',
              }
              observations = outcome['observations']
              assert isinstance(observations, dict) and set(observations) == expected_observations
              for key, value in observations.items():
                  if key.endswith('_status'):
                      assert value is None or type(value) is int
                  else:
                      assert type(value) is bool
              assert isinstance(outcome['children'], list)
              names = {'owner', 'device', 'positive', 'negative'}
              for child in outcome['children']:
                  assert set(child) == {
                      'name', 'shutdown_status', 'escalation', 'exit_status', 'reaped'
                  }
                  assert child['name'] in names
                  assert child['shutdown_status'] is None or type(child['shutdown_status']) is int
                  assert child['escalation'] in {'none', 'term', 'kill'}
                  assert child['exit_status'] is None or type(child['exit_status']) is int
                  assert type(child['reaped']) is bool
              (safe / 'outcome.json').write_text(json.dumps(outcome, sort_keys=True) + '\n')
          complete = all(receipt_presence.values())
          if outcome is None:
              failure_class = 'missing_harness_outcome'
          elif not complete:
              failure_class = 'missing_wrapper_receipt'
          elif outcome['accepted'] is not True:
              failure_class = 'harness_rejected'
          else:
              failure_class = 'none'
          (safe / 'collection.json').write_text(json.dumps({
              'schema': 1,
              'outcome_present': outcome is not None,
              'admission_present': receipt_presence['admission.json'],
              'exit_present': receipt_presence['exit.json'],
              'supervisor_present': receipt_presence['supervisor.json'],
              'failure_class': failure_class,
              'accepted': outcome is not None and complete and outcome['accepted'] is True,
          }, sort_keys=True) + '\n')
          PY
      - name: Enforce semantic acceptance
        if: always() && steps.collect.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          safe = Path(os.environ['RT3_SAFE'])
          collection = json.loads((safe / 'collection.json').read_text())
          assert collection == {
              'schema': 1, 'outcome_present': True, 'admission_present': True,
              'exit_present': True, 'supervisor_present': True,
              'failure_class': 'none', 'accepted': True,
          }, collection
          outcome = json.loads((safe / 'outcome.json').read_text())
          runtime = json.loads((safe / 'runtime.json').read_text())
          admission = json.loads((safe / 'admission.json').read_text())
          wrapper_exit = json.loads((safe / 'exit.json').read_text())
          supervisor = json.loads((safe / 'supervisor.json').read_text())
          assert outcome['accepted'] is True
          assert outcome['stage'] == 'complete' and outcome['status'] == 0
          assert outcome['cleanup_complete'] is True
          assert runtime == {'harness_exit': 0, 'source_unchanged': True}
          assert set(admission) == {
              'namespace_changed', 'interfaces_loopback_only', 'routes_loopback_only',
              'capabilities_empty', 'no_new_privs'
          }
          assert all(value is True for value in admission.values())
          assert wrapper_exit == {'exit': 0}
          assert supervisor['reason'] is None
          assert supervisor['child_exit'] == 0 and supervisor['child_reaped'] is True
          PY
      - name: Upload privacy-safe RT3 receipts
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rt3-hydration-receipts-${{ github.run_id }}
          path: ${{ env.RT3_SAFE }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
