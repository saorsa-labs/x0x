# Disposable RT4 diagnostic only. Never merge this workflow to main.
name: Build
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed 40-hex diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  rt4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      X0X_RUNTIME_TIMEOUT_SECONDS: 900
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Validate input and reserve runtime and receipt budget
        run: |
          python3 - <<'PY'
          import json, os, re, tempfile, time
          from pathlib import Path
          assert re.fullmatch('[0-9a-f]{40}', os.environ['EXPECTED_COMMIT'])
          root = Path(tempfile.mkdtemp(prefix='rt4-hosted-', dir=os.environ['RUNNER_TEMP']))
          assert not root.is_relative_to('/tmp')
          (root / 'raw').mkdir(mode=0o700)
          deadline = time.monotonic() + 27 * 60
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'RT4_ROOT={root}\nRT4_ARTIFACTS={root}/raw\nRT4_OUTER_DEADLINE={deadline}\n')
          (root / 'clock.json').write_text(json.dumps({'outer_deadline_monotonic': deadline,
              'runtime_budget_seconds': 900, 'wrapper_overhead_allowance_seconds': 15,
              'planned_receipt_reserve_seconds': 180}) + '\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify source and install exact tracked lock
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA'] == os.environ['EXPECTED_COMMIT']
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True)
          expected = {
              'Cargo.toml': 'cf781bb4019ded3f2eb96eaaa3dd3912dc1c0e012bd32e5ce994d113a888cc7e',
              'src/bin/rt4_fixture.rs': '2cd6196e8feb09dc713a1b079373ce1bc05c99b8343256281384dae5dca201de',
              'tests/rt4_cache_fixture.rs': '9d783d0a5e06ee9fd145e077c8c505fd32f4ac97e697f9914c8c4dc0602bf15d',
              'tests/rt4_harness.sh': 'e4542aa5cc5eb42a08e45ee5d7dfc2403a990bd72664cd5eb48c4bba6a7858fd',
              'scripts/ci/isolated-runtime.py': '2a0c2521c19d5054b6e77c995e1604e9e9e174208157bb4331b5b38783aedced',
              'scripts/ci/isolation-witness.py': 'dbd753e24b3d082ed434813e575ed214aa70fd8d33b8872f70db1bedb5e0f5ec',
              'ci/491-rt4/Cargo.lock.fixture': '5769726f49c34214f818a9c21e435cfabe02ba5efc1e47a62d6b888c1ee6f9c2',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          assert not Path('Cargo.lock').exists(), 'refuse preexisting lock'
          Path('Cargo.lock').write_bytes(Path('ci/491-rt4/Cargo.lock.fixture').read_bytes())
          Path(os.environ['RT4_ROOT'], 'source.json').write_text(json.dumps({'head': head,
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'files': expected}, indent=2) + '\n')
          PY
      - name: Install exact Rust toolchain and build prerequisites
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - name: Build fresh locked debug daemon and diagnostic fixture
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RT4_ROOT'])
          target = Path.cwd() / 'target'
          target.mkdir(mode=0o700)  # No reused compiler target or binary admission.
          env = {**os.environ, 'CARGO_TARGET_DIR': str(target)}
          metadata = subprocess.check_output(['cargo', 'metadata', '--locked', '--features', 'rt4-diagnostic', '--format-version', '1'], env=env)
          meta = json.loads(metadata)
          package = next(p for p in meta['packages'] if p['manifest_path'] == str(Path.cwd() / 'Cargo.toml'))
          argv = ['cargo', 'build', '--locked', '--features', 'rt4-diagnostic', '--bin', 'x0xd', '--bin', 'rt4_fixture', '--message-format=json']
          with (root / 'build.jsonl').open('wb') as out, (root / 'build.stderr').open('wb') as err:
              build = subprocess.run(argv, env=env, stdout=out, stderr=err)
          record = {'argv': argv, 'exit': build.returncode, 'target': str(target),
                    'rustc': subprocess.check_output(['rustc', '-Vv'], text=True),
                    'cargo': subprocess.check_output(['cargo', '-V'], text=True), 'binaries': {}}
          (root / 'build.json').write_text(json.dumps(record, indent=2) + '\n')
          assert build.returncode == 0, 'locked build failed; no runtime'
          rows = [json.loads(line) for line in (root / 'build.jsonl').read_text().splitlines() if line.startswith('{')]
          for name in ('x0xd', 'rt4_fixture'):
              selected = [r for r in rows if r.get('reason') == 'compiler-artifact' and r.get('package_id') == package['id'] and r.get('target', {}).get('name') == name]
              assert len(selected) == 1 and selected[0]['fresh'] is False
              row = selected[0]; binary = target / 'debug' / name
              assert row['executable'] == str(binary) and row['manifest_path'] == package['manifest_path']
              assert binary.is_file() and os.access(binary, os.X_OK)
              record['binaries'][name] = {'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'cargo': row}
          lock = hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest()
          assert lock == '5769726f49c34214f818a9c21e435cfabe02ba5efc1e47a62d6b888c1ee6f9c2'
          record['lock_sha256'] = lock
          record['packages'] = sorted([{'name': p['name'], 'version': p['version'], 'source': p['source']} for p in meta['packages']], key=lambda p: (p['name'], p['version']))
          (root / 'build.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: One whole-harness namespace execution
        id: runtime
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time
          from pathlib import Path
          root = Path(os.environ['RT4_ROOT'])
          assert float(os.environ['RT4_OUTER_DEADLINE']) - time.monotonic() >= 915, 'no full runtime plus wrapper cleanup budget remains'
          record = json.loads((root / 'build.json').read_text())
          for name, item in record['binaries'].items():
              assert hashlib.sha256(Path('target/debug', name).read_bytes()).hexdigest() == item['sha256']
          env = {**os.environ, 'RT4_RUN': '1', 'RT4_NS_WRAPPER': str(Path('scripts/ci/isolated-runtime.py').resolve())}
          # The reviewed harness invokes the pinned wrapper ONCE around all
          # phases/children/curl calls. Do not double-wrap or run host curls.
          with (root / 'harness.stdout').open('wb') as out, (root / 'harness.stderr').open('wb') as err:
              result = subprocess.run(['bash', 'tests/rt4_harness.sh'], env=env, stdout=out, stderr=err)
          source = json.loads((root / 'source.json').read_text())
          unchanged = all(hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest
                          for name, digest in source['files'].items())
          unchanged = unchanged and hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest() == record['lock_sha256']
          unchanged = unchanged and all(hashlib.sha256(Path('target/debug', name).read_bytes()).hexdigest() == item['sha256']
                                        for name, item in record['binaries'].items())
          (root / 'runtime.json').write_text(json.dumps({'harness_exit': result.returncode,
              'custody_unchanged_after_runtime': unchanged}) + '\n')
          raise SystemExit(result.returncode if result.returncode else (0 if unchanged else 1))
          PY
      - name: Collect only structured privacy-minimal receipts
        id: collect
        if: always() && env.RT4_ROOT != ''
        run: |
          python3 - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ['RT4_ROOT'])
          def read(path, optional=False):
              fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY)
              try:
                  for part in path.parts[1:-1]:
                      nxt = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd); fd = nxt
                  file = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=fd)
                  with os.fdopen(file, 'rb') as stream:
                      info = os.fstat(stream.fileno())
                      assert stat.S_ISREG(info.st_mode) and info.st_size <= 16 * 1024 * 1024
                      return stream.read()
              except FileNotFoundError:
                  if optional: return None
                  raise
              finally:
                  os.close(fd)
          # Fresh upload directory; if rejected, upload must not run.
          assert root.parent == Path(os.environ['RUNNER_TEMP']) and not root.is_symlink()
          upload = root / 'upload'; upload.mkdir(mode=0o700)
          def save(name, value):
              with (upload / name).open('x') as f: json.dump(value, f, indent=2); f.write('\n')
          for name in ('clock.json', 'source.json', 'build.json', 'runtime.json'):
              raw = read(root / name, True)
              if raw is not None: save(name, json.loads(raw))
          raw = read(root / 'raw/namespace-wrapper.log', True)
          lines = raw.decode('utf-8', errors='replace').splitlines() if raw is not None else []
          markers = ('=== Phase 1 PASSED ===', '=== Phase 2 PASSED ===', '=== RT-4 harness ALL PHASES PASSED ===')
          counts = {marker: lines.count(marker) for marker in markers}
          runtime = read(root / 'runtime.json', True)
          runtime = json.loads(runtime) if runtime else {}
          outcome = {'harness_exit': runtime.get('harness_exit'),
                     'custody_unchanged_after_runtime': runtime.get('custody_unchanged_after_runtime'),
                     'phase1_passed': counts[markers[0]] == 1, 'phase2_passed': counts[markers[1]] == 1,
                     'all_phases_marker': counts[markers[2]] == 1, 'wrapper_receipts_present': False}
          dirs = [line.removeprefix('Isolation evidence: ') for line in lines if line.startswith('Isolation evidence: ')]
          if dirs:
              assert len(dirs) == 1
              evidence = Path(dirs[0]); assert evidence.parent == root.parent and evidence.name.startswith('x0x-isolation-')
              receipts = {}
              for name in ('admission.json', 'exit.json', 'supervisor.json'):
                  raw = read(evidence / name, True)
                  if raw is not None: receipts[name] = json.loads(raw); save(name, receipts[name])
              outcome['wrapper_receipts_present'] = len(receipts) == 3
              outcome['wrapped_exit'] = receipts.get('exit.json', {}).get('exit')
              outcome['supervisor_child_reaped'] = receipts.get('supervisor.json', {}).get('child_reaped')
              outcome['supervisor_reason'] = receipts.get('supervisor.json', {}).get('reason')
              outcome['supervisor_child_exit'] = receipts.get('supervisor.json', {}).get('child_exit')
          outcome['accepted'] = (outcome['harness_exit'] == 0
              and all(outcome[k] is True for k in ('phase1_passed', 'phase2_passed', 'all_phases_marker', 'wrapper_receipts_present', 'custody_unchanged_after_runtime'))
              and outcome.get('wrapped_exit') == 0 and outcome.get('supervisor_child_exit') == 0
              and outcome.get('supervisor_child_reaped') is True and outcome.get('supervisor_reason') is None)
          # Collection rejects unsafe paths/schema, not a safely recorded failed
          # result. Acceptance is separate so every safe outcome can be uploaded.
          save('outcome.json', outcome)
          PY
      - name: Require complete harness acceptance
        if: always() && steps.collect.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          outcome = json.loads(Path(os.environ['RT4_ROOT'], 'upload/outcome.json').read_text())
          assert outcome['accepted'] is True, 'RT4 did not produce complete accepted evidence'
          PY
      - name: Upload allowlisted structured receipts
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rt4-receipts-${{ github.run_id }}-${{ github.sha }}
          path: ${{ env.RT4_ROOT }}/upload/
          if-no-files-found: error
          retention-days: 7
