# Disposable #535 diagnostic only. Do not merge this workflow replacement.
name: Bootstrap restart diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
      X0X_RUNTIME_TIMEOUT_SECONDS: 1200
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, failing CI
        with:
          persist-credentials: false
      - name: Verify exact diagnostic source
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, re, subprocess
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['EXPECTED_COMMIT'])
          assert head == os.environ['EXPECTED_COMMIT']
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          assert not subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'])
          expected = {
              'Cargo.toml': 'd4d01c80f179aec856cce40492e127c8773803257c9482675b182671c2778335',
              'tests/fixtures/bootstrap-535-ant-quic-85a.lock': '4e024f966be6807092ef081626a5de3ae3ff07e94f5b5807d5e05595097590eb',
              'src/server/routes/identity.rs': 'c0db5fd0d512941c67bbee717dfa6224a832d80b3760d9f02963ae881dc0e8b5',
              'src/server/routes/public_group_bootstrap_outbox.rs': 'a12934d7adf5e90c93c298410a618880bfa4a8eeed36e0d9d806a68461fd322a',
              'tests/f2_public_group_bootstrap_wiring.rs': 'ecd05257e75644ca7f328f14c2013200b2d6550e5ef1340dd11ab441cf92ed41',
              'scripts/ci/isolated-runtime.py': '2a0c2521c19d5054b6e77c995e1604e9e9e174208157bb4331b5b38783aedced',
              'scripts/ci/isolation-witness.py': 'dbd753e24b3d082ed434813e575ed214aa70fd8d33b8872f70db1bedb5e0f5ec',
              'scripts/ci/nextest-isolated.sh': '008e029735deae07af4b9791649e3bd1af3230aa1b27967c6e4605fcf7d9877c',
              'scripts/ci/nextest-reuse.py': '33a86e237d5ae5fb6d3ce694ccc5d92df08508068649216dd79a9048eb14596f',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-diagnostic'
          evidence.mkdir(mode=0o700)
          (evidence / 'provenance.json').write_text(json.dumps({'head': head, 'files': expected}, indent=2))
          PYCODE
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # failing CI action
        with:
          toolchain: 1.95.0
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-bootstrap-diagnostic-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - uses: actions/cache/restore@v5
        with:
          path: target
          key: ${{ runner.os }}-bootstrap-diagnostic-target
          restore-keys: |
            ${{ runner.os }}-target-test-
      - uses: taiki-e/install-action@ef6302df50adb496d123b03ae2b53322d688ffa1 # failing CI action
        with:
          tool: nextest@0.9.143
      - name: Restore the reviewed lock and fetch dependencies without changing it
        run: |
          set -euo pipefail
          cp tests/fixtures/bootstrap-535-ant-quic-85a.lock Cargo.lock
          cargo fetch --locked
          echo '4e024f966be6807092ef081626a5de3ae3ff07e94f5b5807d5e05595097590eb  Cargo.lock' | sha256sum --check
          cp Cargo.lock "$RUNNER_TEMP/bootstrap-diagnostic/Cargo.lock"
          cargo nextest --version
          rustc --version --verbose
      - name: Run exactly one bootstrap restart test inside the reviewed namespace
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess, tempfile, time
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bootstrap-diagnostic'
          scratch = pathlib.Path(tempfile.mkdtemp(prefix='x0x-metadata-', dir=os.environ['RUNNER_TEMP']))
          expected_lock = '4e024f966be6807092ef081626a5de3ae3ff07e94f5b5807d5e05595097590eb'
          digest_lock = lambda: hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest()
          command = ['python3', 'scripts/ci/isolated-runtime.py', 'python3',
                     'scripts/ci/nextest-reuse.py', 'run', str(scratch), '-E',
                     'test(=bootstrap_outbox_survives_sender_restart_and_clears_only_on_ack)']
          receipt = {'command': command, 'exit': 1, 'lock_sha256': expected_lock,
                     'runtime_started': False, 'stages': []}
          started = time.monotonic()
          try:
              assert digest_lock() == expected_lock, 'unreviewed dependency graph'
              with (evidence / 'stdout.log').open('x') as out, (evidence / 'stderr.log').open('x') as err:
                  def stage(name, args, destination):
                      began = time.monotonic()
                      result = subprocess.run(args, stdout=destination, stderr=err)
                      receipt['stages'].append({'stage': name, 'command': args, 'exit': result.returncode,
                                                'seconds': time.monotonic()-began})
                      receipt['exit'] = result.returncode or 1
                      assert result.returncode == 0, f'{name} failed before runtime'
                      assert digest_lock() == expected_lock, f'{name} changed the lock'
                  with (scratch / 'cargo.json').open('x') as metadata:
                      stage('locked-metadata', ['cargo', 'metadata', '--locked', '--all-features',
                            '--format-version', '1'], metadata)
                  graph = json.loads((scratch / 'cargo.json').read_text())
                  packages = [package for package in graph['packages'] if package['name'] == 'ant-quic']
                  expected_source = 'git+https://github.com/saorsa-labs/ant-quic?rev=85a173a298ce877725c591cf50cea5ea5fc9cb13#85a173a298ce877725c591cf50cea5ea5fc9cb13'
                  assert len(packages) == 1 and packages[0]['source'] == expected_source
                  assert packages[0]['version'] == '0.27.49'
                  dependency_root = pathlib.Path(packages[0]['manifest_path']).parent
                  dependency_head = subprocess.check_output(['git', '-C', str(dependency_root),
                                                            'rev-parse', 'HEAD'], text=True).strip()
                  assert dependency_head == '85a173a298ce877725c591cf50cea5ea5fc9cb13'
                  subprocess.run(['git', '-C', str(dependency_root), 'diff', '--quiet', 'HEAD', '--'], check=True)
                  assert not subprocess.check_output(['git', '-C', str(dependency_root), 'ls-files',
                                                      '--others', '--exclude-standard', '--', 'src',
                                                      'Cargo.toml', 'build.rs', 'ant-quic-workspace-hack'])
                  dependency_files = {
                      'src/p2p_endpoint.rs': '31523515e05b04762b88e65d6b1dd897be0a22fb66b4922959ff7bb6e12786e8',
                      'src/p2p_endpoint/socket_binding.rs': 'ecea5cb6c1cc534f58d87f110bf866de0c79deeaf4bae187e9538f4feb4f9b95',
                  }
                  for name, expected in dependency_files.items():
                      assert hashlib.sha256((dependency_root / name).read_bytes()).hexdigest() == expected
                  receipt['dependency_custody'] = {'head': dependency_head, 'files': dependency_files}
                  resolved = next(node for node in graph['resolve']['nodes'] if node['id'] == packages[0]['id'])
                  receipt['ant_quic'] = {'source': expected_source, 'version': packages[0]['version'],
                                         'features': resolved['features']}
                  with (scratch / 'binaries.json').open('x') as binaries:
                      stage('locked-binaries-only', ['cargo', 'nextest', 'list', '--all-features',
                            '--test', 'f2_public_group_bootstrap_wiring', '--locked', '--cargo-metadata',
                            str(scratch / 'cargo.json'), '--list-type', 'binaries-only',
                            '--message-format', 'json'], binaries)
                  stage('record-custody', ['python3', 'scripts/ci/nextest-reuse.py', 'record', str(scratch)], out)
                  receipt['runtime_started'] = True
                  result = subprocess.run(command, stdout=out, stderr=err)
                  receipt['exit'] = result.returncode
          finally:
              receipt.update(seconds=time.monotonic()-started, lock_unchanged=digest_lock() == expected_lock)
              (evidence / 'command.json').write_text(json.dumps(receipt, indent=2))
              print(json.dumps(receipt), flush=True)
          assert receipt['lock_unchanged'], 'resolved lock changed'
          raise SystemExit(receipt['exit'])
          PYCODE
      - name: Collect explicit evidence whitelist
        id: collect
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, stat
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          # Reject symlinks at every path component; never follow a fixture to
          # private identity/data files. The upload directory must be new.
          def read_regular(relative):
              parts = pathlib.PurePosixPath(relative).parts
              assert parts and all(p not in ('.', '..', '/') for p in parts)
              fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  for part in parts[:-1]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd)
                      fd = child
                  source = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW, dir_fd=fd)
                  with os.fdopen(source, 'rb') as stream:
                      info = os.fstat(stream.fileno())
                      assert stat.S_ISREG(info.st_mode) and info.st_size <= 20_000_000
                      return stream.read()
              finally:
                  os.close(fd)
          upload = root / 'bootstrap-diagnostic-upload'
          upload.mkdir(mode=0o700)
          sources = [f'bootstrap-diagnostic/{name}' for name in
                     ('provenance.json', 'Cargo.lock', 'stdout.log', 'stderr.log', 'command.json')]
          for directory in root.glob('x0x-isolation-*'):
              sources += [f'{directory.name}/{name}' for name in ('admission.json', 'exit.json', 'supervisor.json')]
          for directory in root.glob('x0x-metadata-*'):
              sources += [f'{directory.name}/custody.json']
          for source in sources:
              try:
                  content = read_regular(source)
              except FileNotFoundError:
                  continue  # A failed prerequisite has no runtime receipt.
              with (upload / source.replace('/', '__')).open('xb') as out:
                  out.write(content)
          assert list(upload.iterdir()), 'no evidence collected'
          PYCODE
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5, failing CI
        if: always() && steps.collect.outcome == 'success'
        with:
          name: bootstrap-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bootstrap-diagnostic-upload/
          if-no-files-found: error
          retention-days: 14
