          --expect w3h_1356_red_s3_t_deferred_until_host_commit=GREEN
          --require w3h_1356_red_s3_d5_sibling_marker_needs_manual_clear
          --expect w3h_1356_red_s3_d5_sibling_marker_needs_manual_clear=GREEN
          --require w3h_1356_red_s3_c_promoted_admin_reseats_owner_axis_node
          --expect w3h_1356_red_s3_c_promoted_admin_reseats_owner_axis_node=GREEN
          --require w3h_1356_red_s3_c2_reseat_retires_marker_and_gap
          --expect w3h_1356_red_s3_c2_reseat_retires_marker_and_gap=GREEN
          --require w3h_1666_control_certificate_only_admin_seals
          --expect w3h_1666_control_certificate_only_admin_seals=GREEN
          --require w3h_1578_red_gss_survivor_without_a_roster_kem_key_installs_the_frame_keyless
          --expect w3h_1578_red_gss_survivor_without_a_roster_kem_key_installs_the_frame_keyless=GREEN
          --require w3h_1581_s4_ordinary_admin_revoked
          --expect w3h_1581_s4_ordinary_admin_revoked=GREEN
          --require w3h_1581b_control_dropped_eager_frame_retry_floor
          --expect w3h_1581b_control_dropped_eager_frame_retry_floor=GREEN
          --require w3h_1581b_red_dropped_eager_frame_total_a_loss
          --expect w3h_1581b_red_dropped_eager_frame_total_a_loss=GREEN
          --require w3h_1581c_control_restart_stale_head_resume
          --expect w3h_1581c_control_restart_stale_head_resume=GREEN
          --require w3h_1581c_red_restart_stale_head_no_sync_past_wait
          --expect w3h_1581c_red_restart_stale_head_no_sync_past_wait=RED

      # A shard can upload traces and still exit non-zero (runner error
      # after the cases). The gate above already fails a short or unstable
      # case. This step fails the summary check for any other shard failure.
      - name: Fail unless every shard succeeded
        if: needs.w3h-shard.result != 'success'
        run: |
          echo "W3-H shard matrix result: ${{ needs.w3h-shard.result }}"
          exit 1

      # Traces, receipts, per-thread entropy stats and raw payload dumps
      # (test identities only; the `w3h-gate` profile is the only producer
      # of payload dumps, at most two per case, each capped at 32 MiB).
      - name: Upload W3-H traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: w3h-traces
          path: target/w3h/traces/
          if-no-files-found: warn
          retention-days: 7

  test-windows:
    name: Test Suite (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # #894: scripts/install.ps1 must at least parse under both Windows
      # PowerShell 5.1 (what `irm | iex` runs on a stock machine) and pwsh 7.
      - name: Parse-check scripts/install.ps1
        shell: pwsh
        run: |
          $check = '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1).Path, [ref]$null, [ref]$e); if ($e) { $e | Out-String | Write-Host; exit 1 }'
          foreach ($exe in @('powershell', 'pwsh')) {
            & $exe -NoProfile -Command $check
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed to parse under $exe" }
          }

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-test-

      # #661 / #645 bullet 4: the Windows contention path used to be
      # compile-only in CI (the Build matrix links it; nothing ran it).
      # `cargo test --lib` did not even compile on Windows until the
      # unix-only adr0028 control modules were cfg-gated. Compile the whole
      # lib test suite, then run the instance-lock family so the Windows
      # share-mode guard finally executes in CI.
      - name: Compile the lib test suite
        run: cargo test --lib --no-run

      - name: Run the instance-lock suite
        run: cargo test --lib instance_lock

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      # The coverage compile died with "No space left on device" before any
      # later cleanup could run (jobs 117343704258, 117354063249, 117363548428).
      # Preinstalled SDKs are not inputs. Removing them is the headroom.
      - name: Free preinstalled runner disk
        run: |
          echo "=== disk before freeing preinstalled tools ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            /opt/az \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/graalvm \
            /usr/local/share/boost \
            || true
          sudo apt-get clean || true
          echo "=== disk after freeing preinstalled tools ==="
          df -h

      - name: Record disk before dependency restore
        run: |
          echo "=== disk before dependency restore ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" "${HOME}/.cargo/git" 2>/dev/null || true

      # Exact Rust 1.95.0 and lockfile namespace. coverage-v2 does not match
      # coverage-v1 or the old target-coverage- prefix. No restore-keys: a
      # broader restore puts another dependency graph on the runner, and the
      # rebuild fills the disk (job 117354063249). The instrumented target is
      # not cached. Main's clean build already leaves no room to archive it
      # (run 39011430228, zstd error 70 on the target cache save).
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-rust-1.95.0-coverage-v2-registry-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-rust-1.95.0-coverage-v2-git-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Record disk after dependency restore
        run: |
          echo "=== disk after dependency restore ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" "${HOME}/.cargo/git" 2>/dev/null || true
          # Incremental objects and raw profiles are retained build output.
          # They are not inputs for this coverage run.
          rm -rf target/debug/incremental target/release/incremental target/llvm-cov-target
          if [ -d target ]; then
            find target -name '*.profraw' -delete
          fi
          echo "=== disk after cutting retained artifacts ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" "${HOME}/.cargo/git" 2>/dev/null || true

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin: floating latest can silently change CI behaviour (refs #673)

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Upload before the compile. A worker that dies in the gate keeps this
      # artifact; the job log does not survive a full disk.
      - name: Publish coverage preflight
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-preflight"
          {
            echo "=== coverage preflight ==="
            df -h
            df -P /
            du -sh target "${HOME}/.cargo/registry" "${HOME}/.cargo/git" 2>/dev/null || true
          } | tee "$RUNNER_TEMP/coverage-preflight/disk.txt"

      - name: Upload coverage preflight
        uses: actions/upload-artifact@v5
        with:
          name: coverage-preflight
          path: ${{ runner.temp }}/coverage-preflight/disk.txt
          if-no-files-found: error

      - name: Run line coverage gate
        # Filter timing-flaky binaries from the coverage run only — they
        # keep running in the Test Suite + integration tiers. See the
        # per-binary reasons below (#607); a flake here must not abort the
        # coverage computation:
        #   * x0x_0041_synthetic_kill_restart — documented, matches Test Suite.
        #   * x0x_0041_prefer_newest_test — sibling binary; the
        #     direct_send_reissues_on_replaced_connection_within_500ms test's 2s
        #     lifecycle_deadline is exceeded under coverage contention (#148).
        #     Same class as #139; excluded here only — keeps running in the Test
        #     Suite + integration tiers (binary()-scoped, not test()-scoped).
        #   * named_group_join_metadata_event — gossip-convergence forgery tests
        #     (e.g. forged_member_joined_*) poll a rejection counter that can
        #     exceed the wait window under coverage; the same code paths are
        #     covered by named_group_integration + the x0xd unit tests.
        #
        # Coverage ratchet (issue #124, plan WS1.3). The floor is the kill
        # switch: it must sit just below *current* actual so a coverage
        # regression fails CI before it merges. Bump cadence: raise this floor
        # +3–5 percentage points every release toward the 70% target. Each
        # ratchet bump MUST be accompanied by targeted tests (priority order:
        # exec ACL denial paths → auth middleware → storage/identity error
        # paths → shutdown ordering) or a documented entry in
        # docs/coverage-exclusions.md — never lower the floor to make a red
        # run green.
        #   tranche 1 (#140): 48 → 65.0  (auth-matrix; actual 66.46%)
        #   tranche 2 (#141): 65.0 → 65.6 (exec-ACL denials; actual 66.61%)
        #   tranche 3 (#124): 65.6 → 65.7 (storage/identity errors; actual 66.70%)
        run: |
          disk_snapshot() {
            echo "=== disk: $1 ==="
            df -h
            du -sh target "${HOME}/.cargo/registry" "${HOME}/.cargo/git" 2>/dev/null || true
          }
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/coverage-env.sh"
          source "$RUNNER_TEMP/coverage-env.sh"
          # Incremental objects are retained build output, not coverage data.
          export CARGO_INCREMENTAL=0
          # Full debuginfo is retained object size, not line data. Workspace
          # members keep line tables so the 65.7 line floor still maps.
          # Dependencies are not workspace members; they keep no debuginfo.
          # This file is runner-local. It is not a committed Cargo config.
          mkdir -p .cargo
          {
            echo '[profile.dev]'
            echo 'debug = "line-tables-only"'
            echo 'incremental = false'
            echo
            echo '[profile.dev.package."*"]'
            echo 'debug = false'
            echo
            echo '[profile.test]'
            echo 'debug = "line-tables-only"'
            echo 'incremental = false'
            echo
            echo '[profile.test.package."*"]'
            echo 'debug = false'
          } > .cargo/config.toml
          cargo llvm-cov clean --workspace
          disk_snapshot "before coverage compilation"
          # #607: --no-fail-fast + exit capture. A red test must not abort
          # the step before the report/ratchet below (bash -e would), and the
          # remaining tests' profile data must still be produced. The job
          # still fails on it — see the status merge at the end.
          coverage_test_status=0
          bash scripts/ci/nextest-isolated.sh --all-features --workspace -- --no-fail-fast -E '!binary(x0x_0041_synthetic_kill_restart) & !binary(x0x_0041_prefer_newest_test) & !binary(named_group_join_metadata_event)' || coverage_test_status=$?
          disk_snapshot "after coverage compilation"
          # #607: report and ratchet are still ATTEMPTED after a red test
          # pass; their own failures are captured the same way.
          coverage_report_status=0
          cargo llvm-cov report --workspace --lcov --output-path lcov.info --fail-under-lines 65.7 || coverage_report_status=$?
          coverage_ratchet_status=0
          python3 scripts/check-coverage-thresholds.py --lcov lcov.info --thresholds coverage-thresholds.toml --enforce-global || coverage_ratchet_status=$?
          # Any phase failure fails the job; the first nonzero phase exit
          # becomes the job's exit code (test → report → ratchet).
          status="$coverage_test_status"
          if [ "$status" -eq 0 ]; then status="$coverage_report_status"; fi
          if [ "$status" -eq 0 ]; then status="$coverage_ratchet_status"; fi
          if [ "$status" -ne 0 ]; then
            echo "::error::coverage gate failed (test=$coverage_test_status report=$coverage_report_status ratchet=$coverage_ratchet_status)" >&2
          fi
          exit "$status"

      - name: Cut retained coverage artifacts
        if: always()
        run: |
          echo "=== disk before cutting retained coverage artifacts ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" "${HOME}/.cargo/git" 2>/dev/null || true
          rm -rf target/debug/incremental target/release/incremental target/llvm-cov-target
          if [ -d target ]; then
            find target -name '*.profraw' -delete
          fi
          # Crate sources are needed only while compiling. The registry
          # cache keeps the downloaded crates.
          rm -rf "${HOME}/.cargo/registry/src"
          avail_kb="$(df -P . | awk 'NR==2 {print $4}')"
          echo "available_kb=${avail_kb}"
          # A restored instrumented target plus the next compile does not
          # fit when less than 8 GiB remains. Drop the retained deps.
          if [ "${avail_kb}" -lt 8388608 ]; then
            echo "free space below 8 GiB; removing retained target deps"
            rm -rf target/debug/deps target/release/deps
          fi
          echo "=== disk after cutting retained coverage artifacts ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" "${HOME}/.cargo/git" 2>/dev/null || true

      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lcov-info
          path: lcov.info
          if-no-files-found: error

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skill token budget
        run: |
          python3 scripts/ci/check-skill-size.py
          python3 scripts/ci/check-skill-size.py --self-test

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-doc-

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  parity:
    # Phase 7 parity gate. Surfaces a focused subset of the test suite
    # that proves the named-groups (and broader API) surface stays in
    # sync across CLI, embedded GUI, REST, and the api-manifest. These
    # tests are fast (<30 s) and need no daemon — they are deliberately
    # separated from the broader `test` job so a parity regression
    # surfaces immediately without waiting for the workspace nextest.
    #
    # Adding a new endpoint to `src/api/mod.rs::ENDPOINTS` will fail
    # this job until:
    # - tests/api_coverage.rs is updated (REST handler exists + tested)
    # - the CLI handler exists in src/bin/x0x.rs (parity_cli)
    # - the embedded GUI either calls it or lists it in
    #   tests/gui_named_group_parity.rs::DEFERRED with a reason
    # - docs/design/api-manifest.json is regenerated
    name: API + GUI Parity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-parity-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-parity-

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin: floating latest can silently change CI behaviour (refs #673)

      # parity_cli spawns `x0x <cli_name> --help` so the binary must
      # exist. Build only what's needed.
      - name: Build x0x CLI binary
        run: cargo build --bin x0x --all-features

      - name: Run parity gate
        run: |
          bash scripts/ci/nextest-isolated.sh --all-features \
            --test api_manifest \
            --test parity_cli \
            --test api_coverage \
            --test gui_smoke \
            --test gui_named_group_parity --

      - name: Upload GUI coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gui-named-groups-coverage
          path: tests/proof-reports/parity/gui-named-groups-coverage.txt
          if-no-files-found: ignore

  deployment-authority:
    # Static repository authority check for managed x0xd deployment (ADR 0026,
    # design chapter §3). Pure bash — no Rust toolchain, no fleet contact.
    # Invokes the SAME `just deploy-check` recipe that `just check` reaches
    # locally, then exercises every disclosed control via the self-test so the
    # refusal is witnessed in CI, not just written.
    name: Deployment Authority Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Developer launcher inert controls
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 9), "Python 3.9+ required"'
          python3 scripts/dev/test_test_isolated.py

      - name: Convergence custody inert controls
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          python3 scripts/ci/test_issue442_convergence_custody.py

      - name: Authority check (same recipe as `just check`)
        run: python3 scripts/ci/isolated-runtime.py just deploy-check

      - name: Control self-test (each disclosed condition must flip red)
        run: python3 scripts/ci/isolated-runtime.py just deploy-check-selftest
