name: CI

# The slim hosted set: it must fit a standard GitHub-hosted runner with a
# wide margin. The heavy suites are in ci-full.yml (nightly and on
# dispatch); the studio1 trains run the full suite as the merge gate.
# release.yml `require-green-ci` needs a green run of this workflow on the
# tagged commit, so keep every job here reliable on hosted runners.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CMake 4 (ubuntu-26.04 runners) rejects the bundled opus in audiopus_sys
  # 0.2.2 (cmake_minimum_required < 3.5). The env var alone did not reach the
  # configure call in CI, so the cmake crate also runs a wrapper that adds
  # -DCMAKE_POLICY_VERSION_MINIMUM=3.5. See scripts/ci/cmake-policy-min.sh
  # (#1816). Do not pin or downgrade cmake.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CMAKE_x86_64_unknown_linux_gnu: ${{ github.workspace }}/scripts/ci/cmake-policy-min.sh
  RUST_BACKTRACE: 1

# Retire only an older head of the same pull request. Non-PR runs use their
# unique run ID, so pushes to main and other independently triggered runs can
# never cancel one another or an active pull-request validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # #939: every installer must pin the real release-signing fingerprint,
      # and it must match the key published with the latest release.
      - name: Check installer signing-key fingerprints
        run: python3 scripts/ci/check-installer-fingerprints.py --release

      # #702: nextest comments must not state an unverified ambient-load cause.
      - name: Check nextest load-attribution comments
        run: |
          python3 -B scripts/ci/test_nextest_load_attribution.py -v
          python3 scripts/ci/check-nextest-load-attribution.py
          # #1283: parser and workflow controls; the groups job runs the live
          # nextest controls (X0X_MESH_GROUP_LIVE=1) where binaries exist.
          python3 -B scripts/ci/test_nextest_mesh_serialization.py -v

      # #1871: the apt retry paths, with fake dpkg-query, apt-get and sleep
      # commands. It changes no runner packages and does not wait.
      - name: Test the apt-install.sh retry paths
        run: bash scripts/ci/test_apt_install.sh

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-clippy-

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # W3-H idle-step code is behind `tokio_unstable`. The plain clippy
      # above does not build it (#1245, #1654).
      - name: Run clippy under tokio_unstable
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          RUSTFLAGS: --cfg tokio_unstable

  # Hosted runners have 4 vCPUs and 16 GB of RAM. The full workspace build
  # (the library test crate plus every integration-test binary) ran out of
  # memory there: the runner stopped with exit 143 while rustc built the
  # test graph (#1789; run 44976569803). This job runs the x0x library unit
  # tests only, except the W3-H cases, built with the bounded `ci-hosted`
  # profile (Cargo.toml) and extra swap. The full suite runs on the studio1 trains (the merge gate)
  # and in ci-full.yml (nightly and on dispatch). The main ruleset requires
  # the check name `Test Suite`.
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Check the committed dependency graph
        run: cargo metadata --locked --format-version 1 >/dev/null

      # One profile directory (target/ci-hosted) with one test binary, so
      # the cache stays small.
      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-rust-1.95.0-target-ci-hosted-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.95.0-target-ci-hosted-

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151  # exact pin: floating latest can silently change CI behaviour (refs #673)

      - name: Inert shared wrapper argument controls
        run: |
          python3 -B scripts/ci/test_nextest_isolated.py -v
          python3 -B scripts/ci/test_prune_target_cache.py -v

      # nextest drains a test group's queue only when a test of that group
      # finishes, so mixed `threads-required` values in one group can end
      # the run with tests "not run" and no failure (scripts/ci/
      # check-nextest-groups.py, .config/nextest.toml quic-localhost).
      - name: Check nextest test-group weights
        run: |
          python3 -B scripts/ci/test_check_nextest_groups.py -v
          python3 -B scripts/ci/check-nextest-groups.py

      # The x0x library test crate is one large rustc unit. Swap keeps a
      # peak above 16 GB from stopping the runner (see the Signing path
      # 100k job in ci-full.yml for the measured peak).
      - name: Add build swap
        run: |
          sudo fallocate -l 12G /x0x-build.swap
          sudo chmod 600 /x0x-build.swap
          sudo mkswap /x0x-build.swap
          sudo swapon /x0x-build.swap
          free -m
          df -h /

      # The W3-H cases are ~190 lib tests of up to 6 min each (about 95 min
      # of test time in job 137015743935). They run 20 times each in the
      # ci-full.yml shards, so this job skips them. The other ~7,800 lib
      # tests took about 48 min of test time there, about 12 min on 4 threads.
      - name: Run library unit tests
        id: tests
        env:
          X0X_ISOLATION_ROLE: hosted-lib
          X0X_RUNTIME_TIMEOUT_SECONDS: 1500
        run: bash scripts/ci/nextest-isolated.sh --locked --all-features --lib --cargo-profile ci-hosted -- --no-tests=fail -E 'not test(/w3h/)'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: target/nextest/
          if-no-files-found: ignore

      # #1355: the installer regression tests run in CI. The manifest-verify
      # fixture compiles with `cargo build --offline` against this job's
      # warmed cargo registry. The ps1 suite fails closed when pwsh is
      # missing (ubuntu-latest ships pwsh).
      - name: Installer script tests
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        run: |
          python3 -B tests/test_install_shell_autostart.py -v
          python3 -B tests/test_install_manifest_verify.py -v
          python3 -B tests/test_install_ps1_verify.py -v
          python3 -B tests/test_launcher_dropin.py -v

      - name: Record resources at Test Suite end
        if: always()
        run: |
          free -m
          df -h /
          du -sh target "${HOME}/.cargo/registry" 2>/dev/null || true

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skill token budget
        run: |
          python3 scripts/ci/check-skill-size.py
          python3 scripts/ci/check-skill-size.py --self-test

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-doc-

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  parity:
    # Phase 7 parity gate. Surfaces a focused subset of the test suite
    # that proves the named-groups (and broader API) surface stays in
    # sync across CLI, embedded GUI, REST, and the api-manifest. These
    # tests are fast (<30 s) and need no daemon — they are deliberately
    # separated from the broader `test` job so a parity regression
    # surfaces immediately without waiting for the workspace nextest.
    #
    # Adding a new endpoint to `src/api/mod.rs::ENDPOINTS` will fail
    # this job until:
    # - tests/api_coverage.rs is updated (REST handler exists + tested)
    # - the CLI handler exists in src/bin/x0x.rs (parity_cli)
    # - the embedded GUI either calls it or lists it in
    #   tests/gui_named_group_parity.rs::DEFERRED with a reason
    # - docs/design/api-manifest.json is regenerated
    name: API + GUI Parity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-parity-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-parity-

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151  # exact pin: floating latest can silently change CI behaviour (refs #673)

      # parity_cli spawns `x0x <cli_name> --help` so the binary must
      # exist. Build only what's needed.
      - name: Build x0x CLI binary
        run: cargo build --bin x0x --all-features

      - name: Run parity gate
        run: |
          bash scripts/ci/nextest-isolated.sh --all-features \
            --test api_manifest \
            --test parity_cli \
            --test api_coverage \
            --test gui_smoke \
            --test gui_named_group_parity --

      - name: Upload GUI coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gui-named-groups-coverage
          path: tests/proof-reports/parity/gui-named-groups-coverage.txt
          if-no-files-found: ignore

  deployment-authority:
    # Static repository authority check for managed x0xd deployment (ADR 0026,
    # design chapter §3). Pure bash — no Rust toolchain, no fleet contact.
    # Invokes the SAME `just deploy-check` recipe that `just check` reaches
    # locally, then exercises every disclosed control via the self-test so the
    # refusal is witnessed in CI, not just written.
    name: Deployment Authority Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Developer launcher inert controls
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 9), "Python 3.9+ required"'
          python3 scripts/dev/test_test_isolated.py

      - name: Convergence custody inert controls
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          python3 scripts/ci/test_issue442_convergence_custody.py

      - name: Authority check (same recipe as `just check`)
        run: python3 scripts/ci/isolated-runtime.py just deploy-check

      - name: Control self-test (each disclosed condition must flip red)
        run: python3 scripts/ci/isolated-runtime.py just deploy-check-selftest
