name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Retire only an older head of the same pull request. Non-PR runs use their
# unique run ID, so pushes to main and other independently triggered runs can
# never cancel one another or an active pull-request validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # #939: every installer must pin the real release-signing fingerprint,
      # and it must match the key published with the latest release.
      - name: Check installer signing-key fingerprints
        run: python3 scripts/ci/check-installer-fingerprints.py --release

      # #702: nextest comments must not state an unverified ambient-load cause.
      - name: Check nextest load-attribution comments
        run: |
          python3 -B scripts/ci/test_nextest_load_attribution.py -v
          python3 scripts/ci/check-nextest-load-attribution.py
          # #1283: parser and workflow controls; the groups job runs the live
          # nextest controls (X0X_MESH_GROUP_LIVE=1) where binaries exist.
          python3 -B scripts/ci/test_nextest_mesh_serialization.py -v

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-clippy-

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # W3-H idle-step code is behind `tokio_unstable`. The plain clippy
      # above does not build it (#1245, #1654).
      - name: Run clippy under tokio_unstable
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          RUSTFLAGS: --cfg tokio_unstable

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      # Job 120231656380 died with 54 MB free. Record the raw runner before
      # this job deletes disposable toolchains.
      - name: Record disk at Test Suite start
        run: |
          echo "=== disk at Test Suite start ==="
          df -h

      # Preinstalled SDKs are not Test Suite inputs. Removing them is the
      # same headroom the Coverage Gate uses. It is not enough on its own:
      # the default-feature M2 compile below still needs the all-features
      # target removed first (#1584).
      - name: Free preinstalled runner disk
        run: |
          echo "=== disk before freeing preinstalled tools ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            /opt/az \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/graalvm \
            /usr/local/share/boost \
            || true
          sudo apt-get clean || true
          echo "=== disk after freeing preinstalled tools ==="
          df -h

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      # Resolve an untracked graph before caching; preserve a tracked lock exactly
      # when an integration candidate pins dependencies for test provenance.
      - name: Resolve test dependency graph
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            cargo metadata --locked --format-version 1 >/dev/null
          else
            cargo generate-lockfile
          fi

      # Restore here. Save after the all-features lane, before that target
      # is removed for the default-feature M2 controls (#1584).
      - name: Restore target directory
        id: restore_target
        uses: actions/cache/restore@v5
        with:
          path: target
          # Do not restore a different graph: stale test artifacts can consume the
          # hosted runner disk when changed dependencies must be compiled again.
          key: ${{ runner.os }}-rust-1.95.0-target-test-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin: floating latest can silently change CI behaviour (refs #673)

      - name: Inert shared wrapper argument controls
        run: |
          python3 -B scripts/ci/test_nextest_isolated.py -v
          python3 -B scripts/ci/test_prune_target_cache.py -v

      - name: Prepare bounded convergence custody
        id: prepare_convergence
        run: python3 scripts/ci/issue442-convergence-custody.py prepare

      - name: Record disk before Run tests
        run: |
          echo "=== disk before Run tests ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" "${HOME}/.cargo/git" 2>/dev/null || true

      - name: Run tests
        id: tests
        env:
          X0X_ISOLATION_ROLE: acceptance
        # x0x_0041_synthetic_kill_restart is a documented timing-flaky test
        # (500ms kill/restart bound) — filtered in CI as it is in local dev
        # runs. Tracked separately; do not let it gate unrelated PRs.
        # NB: `binary()` (test-binary name), not `test()` — `test()` would
        # match the test function name, which is different from the binary.
        run: bash scripts/ci/nextest-isolated.sh --all-features --workspace -- -E '!binary(x0x_0041_synthetic_kill_restart)'

      - name: Collect bounded convergence custody
        if: always()
        id: collect_convergence
        env:
          X0X_CUSTODY_EXPECT: ${{ steps.tests.outcome }}
          X0X_ISSUE442_NONCE: ${{ steps.prepare_convergence.outputs.run_nonce }}
        run: python3 scripts/ci/issue442-convergence-custody.py collect

      - name: Upload bounded convergence custody
        if: always() && steps.collect_convergence.outputs.receipt_eligible == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: issue442-convergence-custody
          path: ${{ runner.temp }}/x0x-issue442-receipt/custody-receipt.json
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: target/nextest/

      # Cargo marks the x0x binary test=false. Select its real parser/registry
      # controls explicitly after preserving the broad suite's results above.
      - name: M2 CLI apply-now parser and registry controls
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        id: upgrade_now_cli
        env:
          X0X_ISOLATION_ROLE: m2-cli-now-controls
        run: bash scripts/ci/nextest-isolated.sh --locked --workspace --all-features --bin x0x -- -E 'test(upgrade_now_cli_regressions)' --no-tests=fail

      # Run while the all-features target is still on disk, and after the
      # workspace artifact upload, so this invocation cannot replace those
      # results. A voice failure must not skip the default-feature M2 controls.
      - name: Record disk before Voice pipeline acceptance
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        run: |
          echo "=== disk before Voice pipeline acceptance ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" 2>/dev/null || true

      - name: Voice pipeline acceptance
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        env:
          X0X_ISOLATION_ROLE: voice-pipeline-acceptance
          X0X_RUNTIME_TIMEOUT_SECONDS: 180
        shell: bash
        run: |
          voice_artifact="${RUNNER_TEMP}/voice-pipeline"
          mkdir -p -- "$voice_artifact"
          set +e
          RUNNER_TEMP="$voice_artifact" bash scripts/ci/nextest-isolated.sh --locked --all-features --test voice_e2e -- \
            --run-ignored ignored-only --no-tests=fail \
            -E 'test(=voice_pipeline_delivers_decodable_audio)' \
            >"$voice_artifact/voice-pipeline.log" 2>&1
          status=$?
          set -e
          cat "$voice_artifact/voice-pipeline.log"
          printf '{"native_exit":%d}\n' "$status" >"$voice_artifact/voice-pipeline-exit.json"
          exit "$status"

      - name: Upload voice pipeline results
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@v5
        with:
          name: voice-pipeline-results
          path: ${{ runner.temp }}/voice-pipeline/
          if-no-files-found: error

      # The full target holds ~115 workspace test binaries that change on every
      # PR; archiving them filled the runner disk (#1543). Cache only the
      # third-party build output from this all-features lane.
      - name: Prune target directory for the cache
        if: steps.restore_target.outputs.cache-hit != 'true'
        run: |
          echo "=== disk before pruning the all-features target cache ==="
          df -h
          du -sh target || true
          python3 -B scripts/ci/prune-target-cache.py target
          du -sh target || true

      - name: Save target directory
        if: steps.restore_target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target
          key: ${{ steps.restore_target.outputs.cache-primary-key }}

      # The steps above use --all-features. The M2 controls below compile the
      # default feature set, which is a second graph in the same target.
      # Job 120231656380 kept both and rustc died at 54 MB free. Remove the
      # all-features output after the cache save. always() keeps this step
      # when Voice failed; the outcome checks still require the tests and the
      # all-features CLI control.
      - name: Free intermediate target output
        id: free_intermediate
        if: always() && steps.tests.outcome == 'success' && steps.upgrade_now_cli.outcome == 'success'
        run: |
          echo "=== disk before freeing intermediate target output ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" 2>/dev/null || true
          rm -rf target
          echo "=== disk after freeing intermediate target output ==="
          df -h

      # The workspace all-features lane exercises the debug seam. Also run the
      # committed H controls with the default production trust root in isolation.
      - name: M2 default-key and debug-signing controls
        id: m2_signing
        if: always() && steps.tests.outcome == 'success' && steps.upgrade_now_cli.outcome == 'success' && steps.free_intermediate.outcome == 'success'
        env:
          X0X_ISOLATION_ROLE: m2-signing-controls
        run: |
          echo "=== disk before M2 default-key and debug-signing controls ==="
          df -h
          bash scripts/ci/nextest-isolated.sh --locked --workspace --test upgrade_test_signing -- --no-tests=fail

      # Library fleet guards must also use the production key, not the
      # all-features debug rehearsal key that permits zero-minute windows.
      - name: Record disk before M2 production fleet staging controls
        if: always() && steps.tests.outcome == 'success' && steps.upgrade_now_cli.outcome == 'success' && steps.m2_signing.outcome == 'success'
        run: |
          echo "=== disk before M2 production fleet staging controls ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" 2>/dev/null || true

      - name: M2 production fleet staging controls
        if: always() && steps.tests.outcome == 'success' && steps.upgrade_now_cli.outcome == 'success' && steps.m2_signing.outcome == 'success'
        env:
          X0X_ISOLATION_ROLE: m2-fleet-controls
        run: bash scripts/ci/nextest-isolated.sh --locked --workspace --lib -- -E 'test(fleet_)' --no-tests=fail

      - name: Record disk at Test Suite end
        if: always()
        run: |
          echo "=== disk at Test Suite end ==="
          df -h
          du -sh target "${HOME}/.cargo/registry" 2>/dev/null || true

  signing-path-100k:
    name: Signing path 100k acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Bound concurrent crates and LLVM workers on the standard 16 GiB runner.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry and sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-1.95.0-issue703-cargo-${{ hashFiles('Cargo.toml') }}

      - name: Resolve acceptance dependency graph
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            cargo metadata --locked --format-version 1 >/dev/null
          else
            cargo generate-lockfile
          fi

      - name: Cache acceptance target
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-rust-1.95.0-issue703-target-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144

      - name: Exercise proof and isolation wrapper controls
        run: |
          python3 -B scripts/ci/validate-703-signing-proof.py --self-test
          python3 -B scripts/ci/test_nextest_isolated.py -v

      - name: Prepare acceptance artifact
        shell: bash
        run: |
          artifact="${RUNNER_TEMP}/issue703-signing-test"
          mkdir -m 700 "${artifact}"
          test ! -e "${artifact}/proof.json"

      # The x0x lib test unit at opt-level 3 peaked at 15.7 of 16 GB RAM
      # and 2.9 of 3 GB swap (run 40002832571). A larger lib went past
      # that, and the runner stopped with exit 143 before a test ran
      # (#1533 runs 40003771420, 39995270646).
      - name: Add build swap
        shell: bash
        run: |
          sudo fallocate -l 12G /x0x-build.swap
          sudo chmod 600 /x0x-build.swap
          sudo mkswap /x0x-build.swap
          sudo swapon /x0x-build.swap
          free -m

      - name: Sample signing-path build resources
        shell: bash
        run: |
          artifact="${RUNNER_TEMP}/issue703-signing-test"
          nohup bash -c '
            while true; do
              date -u
              free -m
              df -h / "$RUNNER_TEMP"
              sleep 30
            done
          ' >>"${artifact}/resources.log" 2>&1 </dev/null &
          echo "$!" >"${artifact}/resources.pid"

      - name: Run exact ignored 100k signing-path test
        id: signing_test
        shell: bash
        env:
          X0X_ISOLATION_ROLE: issue703-signing-acceptance
          X0X_RUNTIME_TIMEOUT_SECONDS: 660
          X0X_SLOW_CONSUMER_PROOF: ${{ runner.temp }}/issue703-signing-test/proof.json
        run: |
          set +e
          /usr/bin/time -v -o "${RUNNER_TEMP}/issue703-signing-test/build-and-test.time.txt" \
            bash scripts/ci/nextest-isolated.sh --all-features --lib --cargo-profile signing-acceptance -- \
            --run-ignored ignored-only --no-tests=fail \
            -E 'test(=gossip::pubsub::tests::test_slow_subscriber_isolated_at_100k_messages)'
          status=$?
          set -e
          printf '{"native_exit":%d}\n' "${status}" \
            >"${RUNNER_TEMP}/issue703-signing-test/native-exit.json"
          if [[ ${status} -ne 0 ]]; then
            exit "${status}"
          fi
          python3 -B scripts/ci/validate-703-signing-proof.py \
            "${RUNNER_TEMP}/issue703-signing-test/proof.json"

      - name: Print signing-path resource samples
        if: always()
        shell: bash
        run: |
          artifact="${RUNNER_TEMP}/issue703-signing-test"
          if [[ -f "${artifact}/resources.pid" ]]; then
            kill "$(cat "${artifact}/resources.pid")" 2>/dev/null || true
          fi
          if [[ -f "${artifact}/resources.log" ]]; then
            tail -n 120 "${artifact}/resources.log"
          fi
          if [[ -f "${artifact}/build-and-test.time.txt" ]]; then
            cat "${artifact}/build-and-test.time.txt"
          fi

      - name: Upload signing-path acceptance custody
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: issue703-signing-path-100k
          path: |
            ${{ runner.temp }}/issue703-signing-test/
            ${{ runner.temp }}/x0x-metadata-*/
            ${{ runner.temp }}/x0x-isolation-*/
          if-no-files-found: error

  linux-systemd-policy:
    name: Linux systemd policy acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Resolve acceptance dependency graph
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            cargo metadata --locked --format-version 1 >/dev/null
          else
            cargo generate-lockfile
          fi

      - name: Cache cargo registry and sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-1.95.0-linux690-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Cache acceptance target
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-rust-1.95.0-linux690-target-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'examples/linux690_systemd_probe.rs') }}

      - name: Build only the systemd acceptance probe
        env:
          CARGO_BUILD_JOBS: 4
        run: cargo build --locked --example linux690_systemd_probe

      - name: Exercise inert runner controls
        run: python3 -B scripts/ci/test_linux690_systemd_acceptance.py -v

      - name: Exercise inert M2 release metadata controls
        run: python3 -B .github/scripts/test_m2_release_signing_gate.py -v

      - name: Prepare Linux acceptance custody
        shell: bash
        run: |
          artifact="${RUNNER_TEMP}/linux690-systemd-acceptance"
          mkdir -m 700 "${artifact}"
          git rev-parse HEAD >"${artifact}/source-head.txt"
          git rev-parse 'HEAD^{tree}' >"${artifact}/source-tree.txt"
          sha256sum Cargo.lock >"${artifact}/cargo-lock-sha256.txt"
          sha256sum target/debug/examples/linux690_systemd_probe >"${artifact}/probe-pre-run-sha256.txt"

      - name: Exercise loaded systemd policy and clean-exit respawn
        id: systemd_acceptance
        shell: bash
        run: |
          artifact="${RUNNER_TEMP}/linux690-systemd-acceptance"
          set +e
          sudo scripts/ci/linux690-systemd-acceptance.sh \
            --probe "${GITHUB_WORKSPACE}/target/debug/examples/linux690_systemd_probe" \
            --manager system \
            --artifact-root "${artifact}"
          acceptance_status=$?
          set -e
          if ! sudo test -d "${artifact}"; then
            sudo mkdir -m 700 -p "${artifact}"
          fi
          sudo chown -R "$(id -u):$(id -g)" "${artifact}"
          sha256sum target/debug/examples/linux690_systemd_probe >"${artifact}/probe-post-run-sha256.txt"
          printf 'ACCEPTANCE_EXIT=%s\n' "${acceptance_status}" >"${artifact}/workflow-exit.txt"
          exit "${acceptance_status}"

      - name: Exercise literal systemd paths and arguments
        shell: bash
        run: |
          # A sibling keeps the dropped fixture owner from traversing the
          # acceptance directory after it has been returned to the runner.
          artifact="${RUNNER_TEMP}/linux690-systemd-literals"
          python3 -B scripts/ci/test_systemd_literals.py --self-test
          set +e
          sudo python3 -B scripts/ci/test_systemd_literals.py \
            --probe "${GITHUB_WORKSPACE}/target/debug/examples/linux690_systemd_probe" \
            --artifact-root "${artifact}"
          literal_status=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" "${artifact}"
          printf 'LITERAL_ACCEPTANCE_EXIT=%s\n' "${literal_status}" >"${artifact}/workflow-exit.txt"
          mv "${artifact}" "${RUNNER_TEMP}/linux690-systemd-acceptance/literals"
          exit "${literal_status}"

      - name: Upload Linux systemd acceptance custody
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux690-systemd-acceptance
          path: ${{ runner.temp }}/linux690-systemd-acceptance/
          if-no-files-found: error


  w3h-plan:
    # Names the case groups for the matrix. A case is in exactly one group.
    # S3 (`w3h_1356_`) and S4 (`w3h_1357_`) each have a group, so more of
    # those cases extend that shard only. The group is omitted when the
    # tree has no matching test (main has no S3 cases yet).
    name: W3-H shard plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the shard plan and the trace gate
        run: |
          python3 -B scripts/ci/test_w3h_shards.py -v
          python3 -B scripts/ci/test_w3h_trace_check.py -v

      - id: plan
        name: Emit the shard matrix
        run: |
          matrix="$(python3 -B scripts/ci/w3h-shards.py --matrix)"
          echo "W3-H shards: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  w3h-shard:
    # One group, still `--stress-count 20`. The summary job below is the
    # D196 gate. `fail-fast: false` so one bad group still uploads traces.
    name: W3-H shard (${{ matrix.group }})
    needs: w3h-plan
    runs-on: ubuntu-latest
    # S3 runs the H-S3-c/c2 owner-cert rows at 15 min each (#1689) and the
    # H-S3-d7 flood row (#1717), so its group gets 165 min (Engineer ruling,
    # 30 Oct; no shard split). Every other group keeps 120 min. The isolated test
    # phase has its own deadline (`X0X_RUNTIME_TIMEOUT_SECONDS` below), which
    # must also fit inside this limit with room for setup and upload.
    timeout-minutes: ${{ matrix.group == 's3' && 165 || 120 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.w3h-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          # Per shard. Parallel saves of one key race, and each shard's
          # `target/` differs after its own test run.
          key: ${{ runner.os }}-rust-1.95.0-target-w3h-${{ matrix.group }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # same exact pin as the Test Suite

      - name: Build the W3-H preload shim
        run: |
          mkdir -p target/w3h
          cc -O2 -Wall -Wextra -Werror -shared -fPIC -o target/w3h/libw3h_shim.so scripts/w3h/w3h_shim.c -ldl
          rm -rf target/w3h/traces

      - name: Run W3-H cases 20 times
        env:
          X0X_ISOLATION_ROLE: w3h-harness
          # The deadline of the isolated test phase only (the build runs
          # before it). S3 needs about 135 min for 20 reruns, so it gets
          # 9300 s (155 min) inside its 165-min job; every other group keeps
          # 6600 s. `isolated-runtime.py` caps the value at 21600 s.
          X0X_RUNTIME_TIMEOUT_SECONDS: ${{ matrix.group == 's3' && 9300 || 6600 }}
        # `--run-ignored all`: include LD_PRELOAD-only unit tests declared
        # `#[ignore]` (ADR 0025 §3–4; e.g. w3h_system_time_follows_pull_callback_via_shim).
        # The profile default-filter still intersects this expression, so
        # only `w3h_` tests run. Repeat count stays 20.
        # `--cfg tokio_unstable` is this job only. Release binaries and the
        # other CI jobs do not set it (#1245). `CARGO_ENCODED_RUSTFLAGS`
        # replaces `RUSTFLAGS` when it is set, so append to whichever is live.
        # `--build-jobs 1` applies only to the host `cargo nextest list` of
        # this lib test unit. The isolated run reuses that binary and does
        # not compile again. On image ubuntu24/20261025.353 the runner stops
        # that build with exit 143 and "The runner has received a shutdown
        # signal", with no "exceeded the maximum execution time" line.
        # #1704 run 41011145001 rest jobs 123917553873 and 123947546006, and
        # all three rest attempts of #1719 run 40996713847, died about 10 min
        # into the job in the silent rustc after tikv-jemalloc. There was no
        # "Finished" line and no "Isolation evidence" line, so no test had
        # started. The 300 s w3h-gate slow-timeout and the 6600 s isolation
        # deadline were not in force. The same cold build finishes on main
        # (7m27s in run 41010602403, 11m34s in run 40993619879, 11m43s in run
        # 41029213415) and on the sibling shards of those pull requests.
        # #1597 long-1023 job 123955870023 died the same way, so the rest
        # filter is not the cause. Property tests already pass
        # `--build-jobs 1` after the same 143 on this image during
        # `cargo nextest list` (run 40530790509). One build job does not
        # change the test binary. The 120 min and 165 min job budgets stay.
        run: |
          if [ -n "${CARGO_ENCODED_RUSTFLAGS:-}" ]; then
            export CARGO_ENCODED_RUSTFLAGS="${CARGO_ENCODED_RUSTFLAGS}"$'\x1f'"--cfg"$'\x1f'"tokio_unstable"
          else
            export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--cfg tokio_unstable"
          fi
          filter="$(python3 -B scripts/ci/w3h-shards.py --filter "${{ matrix.group }}")"
          echo "W3H-SHARD-START group=${{ matrix.group }} filter=${filter}"
          python3 -B scripts/ci/w3h-shards.py --list "${{ matrix.group }}"
          bash scripts/ci/nextest-isolated.sh --all-features --build-jobs 1 --lib -- \
            --profile w3h-gate --run-ignored all --stress-count 20 -E "$filter"
          echo "W3H-SHARD-END group=${{ matrix.group }}"

      - name: Upload W3-H shard traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: w3h-traces-${{ matrix.group }}
          path: target/w3h/traces/
          if-no-files-found: warn
          retention-days: 7

  w3h-harness:
    # W3-H (#1164): deterministic simulation harness. The shards above run
    # every `w3h_` case 20 times. This job merges their traces and requires
    # the same verdict in every rerun with complete receipts (ruling D196).
    # Distinct canonical traces per case are reported, not required.
    # The check name stays `W3-H harness (determinism)`.
    name: W3-H harness (determinism)
    needs: w3h-shard
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download shard traces
        uses: actions/download-artifact@v5
        with:
          pattern: w3h-traces-*
          path: w3h-incoming
          merge-multiple: true

      - name: Merge shard traces
        run: |
          mkdir -p target/w3h/traces
          find w3h-incoming -type f -print0 | while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            dest="target/w3h/traces/${base}"
            if [ -e "$dest" ]; then
              echo "duplicate W3-H trace file ${base}" >&2
              exit 1
            fi
            cp "$file" "$dest"
          done
          traces="$(find target/w3h/traces -name '*.trace' | wc -l)"
          echo "W3H-MERGED traces=${traces}"
          test "${traces}" -gt 0

      # D196: blocking on the verdict (the same in all 20 reruns, every
      # receipt complete); the per-case distinct-trace counts are printed
      # (`W3H-TRACES`) and do not fail the job.
      # D30 restart-cold row for #1105: w3h_1105_red_baseline_restarted_replica_stays_at_n
      # (RED), w3h_1105_restarted_replica_obtains_n_plus_one_snapshot (GREEN),
      # and w3h_1105_invite_only_restart_obtains_n_plus_one_from_local_admin
      # (GREEN, D272). This is the existing 20-rerun gate, not a separate workflow.
      - name: W3-H gate (verdict-stable reruns, D196)
        run: >-
          python3 scripts/ci/w3h-trace-check.py target/w3h/traces --runs 20
          --require w3h_s1_control_group_invite_join_over_public_api
          --require w3h_red_1256_gossip_only_event_after_a_gossip_member_added
