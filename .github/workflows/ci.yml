          --expect w3h_1023_control_holders_never_return_fail_closed=GREEN
          --require w3h_1023_control_holder_returns_recovers
          --expect w3h_1023_control_holder_returns_recovers=GREEN
          --require w3h_1356_red_s3_aligned_stale_joiner_catches_up
          --expect w3h_1356_red_s3_aligned_stale_joiner_catches_up=GREEN
          --require w3h_1356_control_s3_attestation_touches_only_the_subject
          --expect w3h_1356_control_s3_attestation_touches_only_the_subject=GREEN
          --require w3h_1356_control_s3_d7_request_flood_rate_limited
          --expect w3h_1356_control_s3_d7_request_flood_rate_limited=GREEN
          --require w3h_1356_control_s3_s64_segment_boundary
          --expect w3h_1356_control_s3_s64_segment_boundary=GREEN
          --require w3h_1356_control_s3_x_attestation_conflict_stops_at_common_prefix
          --expect w3h_1356_control_s3_x_attestation_conflict_stops_at_common_prefix=GREEN
          --require w3h_1356_red_s3_forked_node_shows_reseat_required
          --expect w3h_1356_red_s3_forked_node_shows_reseat_required=GREEN
          --require w3h_1356_control_s3_forked_node_not_auto_recovered
          --expect w3h_1356_control_s3_forked_node_not_auto_recovered=GREEN
          --require w3h_1356_red_s3_manual_reseat_recovers_forked_node
          --expect w3h_1356_red_s3_manual_reseat_recovers_forked_node=GREEN
