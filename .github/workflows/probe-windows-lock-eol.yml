name: probe windows lock eol (DO NOT MERGE)
on: pull_request
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [control-no-gitattributes, fix-gitattributes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply variant
        shell: bash
        run: |
          git config --get core.autocrlf || echo "autocrlf unset"
          if [ "${{ matrix.variant }}" = control-no-gitattributes ]; then
            git rm -q --cached .gitattributes && rm -f .gitattributes
            rm -f Cargo.lock && git checkout -- Cargo.lock
          fi
          file Cargo.lock; head -c 200 Cargo.lock | od -c | head -4
      - name: Simulate install-lock (copy LF Cargo.lock from git object)
        shell: bash
        run: |
          git show HEAD:Cargo.lock > "$RUNNER_TEMP/lock" && cp "$RUNNER_TEMP/lock" Cargo.lock
          echo "status after copy:"; git status --porcelain --untracked-files=no -- Cargo.lock
          test -z "$(git status --porcelain --untracked-files=no -- Cargo.lock)" && echo CLEAN || { echo DIRTY; exit 1; }
