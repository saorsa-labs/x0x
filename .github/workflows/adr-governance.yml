name: ADR Governance

on:
  pull_request:
    paths:
      - 'docs/adr/**'
      - 'docs/adr-archive/**'
      - 'docs/grounding/**'
      - '.adr-kit.yaml'
      - 'scripts/adr-governance.py'
      - 'scripts/check-adr-consolidation.py'
      - 'scripts/check-adr-count.py'
      - 'scripts/test_adr_consolidation.py'
      - 'scripts/test_adr_count.py'
      - '.github/workflows/adr-governance.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/adr/**'
      - 'docs/adr-archive/**'
      - 'docs/grounding/**'
      - '.adr-kit.yaml'
      - 'scripts/adr-governance.py'
      - 'scripts/check-adr-consolidation.py'
      - 'scripts/check-adr-count.py'
      - 'scripts/test_adr_consolidation.py'
      - 'scripts/test_adr_count.py'
      - '.github/workflows/adr-governance.yml'

jobs:
  adr-governance:
    name: Validate ADRs and immutable Accepted status
    runs-on: ubuntu-latest
    env:
      # Actions event name. pull_request uses the merge-base. push uses GITHUB_BEFORE.
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      # Previous tip. All zeros when the branch is created. A force-push keeps
      # the old tip, which can be absent from the pull-request checkout.
      GITHUB_BEFORE: ${{ github.event.before }}
      # Pull request: exact base commit. The count check uses this on pull_request.
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # D280. The event pull request number. A file in the checkout cannot set it.
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit-test ADR governance helpers
        run: python3 scripts/test_adr_governance.py
      - name: Run ADR governance checks
        run: python3 scripts/adr-governance.py
      - name: Test the 15-slot transition rules
        run: python3 scripts/test_adr_consolidation.py
      - name: Check the 15-slot replacement set
        run: python3 scripts/check-adr-consolidation.py
      - name: Test the current ADR count
        run: python3 scripts/test_adr_count.py
      - name: Check the current ADR count
        run: python3 scripts/check-adr-count.py
