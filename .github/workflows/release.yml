name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Prevent concurrent release workflows from racing on asset uploads.
# A new tag push cancels any in-flight release for a previous tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  validate-release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test release metadata validation
        run: python3 .github/scripts/test_release_metadata.py

      # Single gate for both tag pushes and workflow_dispatch: the validator
      # refuses any run whose actual ref is not a valid release tag
      # (refs/tags/vX.Y.Z) matching Cargo.toml/SKILL.md/agent.json. A branch
      # dispatch or malformed tag therefore fails here, in the first job —
      # before build-release, sign-release, create-release, or any publish
      # job can start.
      - name: Validate release metadata
        run: |
          python3 .github/scripts/validate_release_metadata.py \
            --mode release_tag \
            --tag "${GITHUB_REF_NAME}" \
            --ref "${GITHUB_REF}"

  # ============================================================
  # Gate: never ship on red (or unknown) CI (#128 / WS1.7)
  # ============================================================
  require-green-ci:
    name: Require green CI on tagged commit
    runs-on: ubuntu-latest
    # Serialize behind metadata validation: an invalid dispatch ref must be
    # refused before this job burns up to 45 minutes of CI polling.
    needs: validate-release-metadata
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Require a successful CI run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh run list` needs the repo; without a checkout `gh` cannot infer
          # it from git and reports the CI run as "missing", failing the gate
          # even when CI is green. Pin the repo explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          # A release must never ship on red (or still-running / missing) CI.
          # The CI workflow runs on push to main and on PRs; a commit tagged
          # for release that was merged to main already has a run we can
          # observe. ci.yml is NOT triggered by the tag push itself (it gates
          # on branch main), so this observes the run from the merge. Poll for
          # up to 45 minutes so a CI run still in flight may finish, then
          # require conclusion == success. (#476: the Coverage Gate alone now
          # runs past 20 minutes — the old ceiling forced a manual rerun on
          # every release; v0.41.0's tag had to be released by hand.)
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            json=$(gh run list --workflow ci.yml --commit "${SHA}" \
                   --json status,conclusion --limit 50 || echo '[]')
            status=$(printf '%s' "${json}" | jq -r '.[0].status // "missing"')
            conclusion=$(printf '%s' "${json}" | jq -r '.[0].conclusion // "missing"')
            echo "Newest CI run for ${SHA}: status=${status} conclusion=${conclusion}"
            if [ "${conclusion}" = "success" ]; then
              echo "CI is green for ${SHA} — proceeding with release."
              exit 0
            fi
            if [ "${status}" = "completed" ]; then
              echo "::error::CI concluded '${conclusion}' (not 'success') for ${SHA}. Refusing to release on red CI."
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::CI did not reach a terminal state within 45 minutes for ${SHA} (status=${status}). Refusing to release on unknown CI."
              exit 1
            fi
            echo "CI run is '${status}'; waiting 30s before re-checking..."
            sleep 30
          done

  # ============================================================
  # Resolve one dependency graph for every release build and signer.
  # ============================================================
  resolve-release-lock:
    name: Resolve release dependency graph
    needs: [validate-release-metadata, require-green-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and capture release lock
        run: |
          cargo generate-lockfile
          python3 .github/scripts/release_artifact_custody.py resolve \
            --repo . --output "${RUNNER_TEMP}/release-lock"
      - uses: actions/upload-artifact@v5
        with:
          name: release-lock
          path: ${{ runner.temp }}/release-lock/
          if-no-files-found: error

  # ============================================================
  # Build release binaries for all platforms
  # ============================================================
  build-release:
    name: Build ${{ matrix.platform }}
    # Keep the release safety gates explicit on the side-effecting build job.
    # The lock job also depends on both, but direct needs make accidental
    # rewiring of that artifact producer fail closed under the static guard.
    needs: [validate-release-metadata, require-green-ci, resolve-release-lock]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            archive: tar.gz
            binary: x0xd

          - platform: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
            archive: tar.gz
            binary: x0xd

          - platform: linux-arm64-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            archive: tar.gz
            binary: x0xd

          - platform: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            cross: false
            archive: tar.gz
            binary: x0xd

          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            cross: false
            archive: tar.gz
            binary: x0xd

          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            archive: zip
            binary: x0xd.exe

    steps:
      - uses: actions/checkout@v5

      - name: Download resolved release lock
        uses: actions/download-artifact@v5
        with:
          name: release-lock
          path: ${{ runner.temp }}/release-lock

      - name: Install and verify resolved release lock
        shell: bash
        run: |
          python3 .github/scripts/release_artifact_custody.py install-lock \
            --repo . --custody "${RUNNER_TEMP}/release-lock"

      - name: Capture source and dependency provenance
        shell: bash
        run: |
          python3 .github/scripts/build_artifact_provenance.py prepare \
            --repo . \
            --artifact-dir "${RUNNER_TEMP}/release-${{ matrix.platform }}-custody" \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --release --target ${{ matrix.target }} \
            --bin x0xd --bin x0x --message-format=json-render-diagnostics \
            | tee "${RUNNER_TEMP}/release-${{ matrix.platform }}-build.jsonl"

      - name: Build (cross)
        if: matrix.cross
        shell: bash
        run: |
          set -o pipefail
          cross build --locked --release --target ${{ matrix.target }} \
            --bin x0xd --bin x0x --message-format=json-render-diagnostics \
            | tee "${RUNNER_TEMP}/release-${{ matrix.platform }}-build.jsonl"

      # ---- macOS Code Signing & Notarization ----
      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign macOS binaries
        if: startsWith(matrix.platform, 'macos')
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for bin in x0xd x0x; do
            BINARY="target/${{ matrix.target }}/release/${bin}"
            if [ -f "$BINARY" ]; then
              codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" --timestamp "$BINARY"
              codesign --verify --deep --strict "$BINARY"
              echo "Signed ${bin} successfully"
            fi
          done

      # Notarization contacts Apple and validates the Developer Program License
      # Agreement; an expired/unsigned agreement returns HTTP 403 and is an
      # account-level blocker, not a build defect. Binaries are still codesigned
      # (the Sign step above uses an offline cert), so an un-notarized macOS
      # binary is usable with a Gatekeeper prompt. Keep this non-blocking so a
      # lapsed agreement cannot hold back the Linux/Windows release + crates.io
      # publish; re-run once the agreement is re-signed to ship notarized macOS.
      - name: Notarize macOS binaries
        if: startsWith(matrix.platform, 'macos')
        continue-on-error: true
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          for bin in x0xd x0x; do
            BINARY="target/${{ matrix.target }}/release/${bin}"
            if [ -f "$BINARY" ]; then
              ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/notarize-${bin}.zip"
              if xcrun notarytool submit "$RUNNER_TEMP/notarize-${bin}.zip" \
                --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
                --password "$MACOS_NOTARIZATION_PASSWORD" \
                --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
                --wait; then
                echo "Notarized ${bin} successfully"
              else
                echo "::warning::Notarization failed for ${bin} (likely an expired Apple Developer agreement); shipping signed-but-un-notarized binary. Re-run the release after re-signing the agreement to notarize."
              fi
            fi
          done

      - name: Clean up macOS keychain
        if: startsWith(matrix.platform, 'macos') && always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      # ---- Strip Linux binaries ----
      - name: Strip binaries (Linux native)
        if: matrix.platform == 'linux-x64-gnu'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary }}
          strip target/${{ matrix.target }}/release/x0xd
          strip target/${{ matrix.target }}/release/x0x

      - name: Capture final packaged binary custody
        shell: bash
        run: |
          python3 .github/scripts/build_artifact_provenance.py finalize \
            --repo . \
            --artifact-dir "${RUNNER_TEMP}/release-${{ matrix.platform }}-custody" \
            --release-dir "target/${{ matrix.target }}/release" \
            --build-messages "${RUNNER_TEMP}/release-${{ matrix.platform }}-build.jsonl"
          python3 .github/scripts/build_artifact_provenance.py verify \
            --artifact-dir "${RUNNER_TEMP}/release-${{ matrix.platform }}-custody"

      # ---- Package artifacts ----
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          STAGING="x0x-${{ matrix.platform }}"
          mkdir -p "$STAGING"
          CUSTODY="${RUNNER_TEMP}/release-${{ matrix.platform }}-custody"
          for bin in x0xd x0x; do
            cp "$CUSTODY/$bin" "$STAGING/$bin"
          done
          cp "$CUSTODY/Cargo.lock" "$CUSTODY/build-provenance.json" "$STAGING/"
          cp LICENSE* "$STAGING/" 2>/dev/null || true
          cp README.md "$STAGING/" 2>/dev/null || true
          COPYFILE_DISABLE=1 tar czf "x0x-${{ matrix.platform }}.tar.gz" "$STAGING"
          echo "ASSET=x0x-${{ matrix.platform }}.tar.gz" >> $GITHUB_ENV

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "x0x-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $staging -Force
          $custody = "$env:RUNNER_TEMP/release-${{ matrix.platform }}-custody"
          foreach ($bin in @("x0xd.exe", "x0x.exe")) {
            Copy-Item "$custody/$bin" -Destination "$staging/$bin"
          }
          Copy-Item "$custody/Cargo.lock", "$custody/build-provenance.json" -Destination $staging
          if (Test-Path "LICENSE*") { Copy-Item LICENSE* -Destination $staging }
          if (Test-Path "README.md") { Copy-Item README.md -Destination $staging }
          Compress-Archive -Path "$staging/*" -DestinationPath "x0x-${{ matrix.platform }}.zip"
          "ASSET=x0x-${{ matrix.platform }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          # Use sha256sum (Linux/Windows) or shasum (macOS)
          hash_cmd="sha256sum"
          if ! command -v sha256sum &>/dev/null; then
            hash_cmd="shasum -a 256"
          fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            $hash_cmd "x0x-${{ matrix.platform }}.zip" > "x0x-${{ matrix.platform }}.zip.sha256"
          else
            $hash_cmd "x0x-${{ matrix.platform }}.tar.gz" > "x0x-${{ matrix.platform }}.tar.gz.sha256"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.platform }}
          path: |
            x0x-${{ matrix.platform }}.*
          if-no-files-found: error

  # ============================================================
  # ML-DSA-65 sign release archives (post-quantum)
  # ============================================================
  sign-release:
    name: ML-DSA-65 Sign Archives
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download resolved release lock
        uses: actions/download-artifact@v5
        with:
          name: release-lock
          path: ${{ runner.temp }}/release-lock

      - name: Install and verify resolved release lock
        run: |
          python3 .github/scripts/release_artifact_custody.py install-lock \
            --repo . --custody "${RUNNER_TEMP}/release-lock"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sign-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build x0x-keygen
        run: cargo build --locked --release --bin x0x-keygen

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: release-*

      - name: Verify all packaged release custody
        run: |
          python3 .github/scripts/release_artifact_custody.py aggregate \
            --custody "${RUNNER_TEMP}/release-lock" \
            --artifacts artifacts \
            --output release-custody.json

      - name: Write ML-DSA-65 signing key
        env:
          ML_DSA_SECRET_KEY: ${{ secrets.ML_DSA_SECRET_KEY }}
        run: |
          echo "$ML_DSA_SECRET_KEY" | base64 --decode > /tmp/release-signing.secret
          chmod 600 /tmp/release-signing.secret

      - name: Sign archives with ML-DSA-65
        run: |
          for archive in artifacts/release-*/*.tar.gz artifacts/release-*/*.zip; do
            [ -f "$archive" ] || continue
            ./target/release/x0x-keygen sign \
              --key /tmp/release-signing.secret \
              --input "$archive" \
              --output "${archive}.sig" \
              --context "x0x-release-v1"
            echo "Signed: $archive"
          done

      - name: Generate and sign release manifest
        run: |
          # Collect all archives AND their ML-DSA-65 signatures into a flat
          # directory for manifest generation. x0x-keygen manifest requires each
          # archive's sibling .sig to live alongside it in --assets-dir.
          mkdir -p manifest-assets
          for archive in artifacts/release-*/*.tar.gz artifacts/release-*/*.zip; do
            [ -f "$archive" ] || continue
            cp "$archive" manifest-assets/
            [ -f "${archive}.sig" ] && cp "${archive}.sig" manifest-assets/
          done
          # Strip 'v' prefix from tag for version string
          VERSION="${GITHUB_REF_NAME#v}"
          # Validate that VERSION is a valid semver string (defense in depth:
          # the metadata-validation job already refused non-tag refs)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: '$VERSION' is not a valid semver version (expected tag like v1.2.3)"
            exit 1
          fi
          ./target/release/x0x-keygen manifest \
            --version "$VERSION" \
            --assets-dir manifest-assets/ \
            --skill-path SKILL.md \
            --key /tmp/release-signing.secret \
            --output-dir manifest-assets/

      - name: Clean up signing key
        if: always()
        run: rm -f /tmp/release-signing.secret

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ml-dsa-signatures
          path: artifacts/release-*/*.sig
          if-no-files-found: error

      - name: Upload release manifest
        uses: actions/upload-artifact@v5
        with:
          name: release-manifest
          path: |
            manifest-assets/release-manifest.json
            manifest-assets/release-manifest.json.sig
          if-no-files-found: error

      - name: Upload aggregate release custody
        uses: actions/upload-artifact@v5
        with:
          name: release-custody
          path: release-custody.json
          if-no-files-found: error

  # ============================================================
  # GPG-sign SKILL.md and create GitHub Release
  # ============================================================
  create-release:
    name: Create GitHub Release
    needs: [build-release, sign-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: release-*

      - name: Download ML-DSA-65 signatures
        uses: actions/download-artifact@v5
        with:
          name: ml-dsa-signatures
          path: artifacts

      - name: Download release manifest
        uses: actions/download-artifact@v5
        with:
          name: release-manifest
          path: artifacts/manifest

      - name: Download aggregate release custody
        uses: actions/download-artifact@v5
        with:
          name: release-custody
          path: artifacts/custody

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --import --batch --yes

      - name: Sign SKILL.md
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --detach-sign --armor --output SKILL.md.sig SKILL.md <<< "$GPG_PASSPHRASE"
          gpg --verify SKILL.md.sig SKILL.md

      - name: Export public key
        run: |
          gpg --armor --export david@saorsalabs.com > SAORSA_PUBLIC_KEY.asc
          if [ ! -s SAORSA_PUBLIC_KEY.asc ]; then
            echo "Error: Failed to export public key"
            exit 1
          fi

      - name: GPG-sign release archives
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for archive in artifacts/release-*/*.tar.gz artifacts/release-*/*.zip; do
            [ -f "$archive" ] || continue
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
              --detach-sign --armor --output "${archive}.asc" "$archive" <<< "$GPG_PASSPHRASE"
          done

      - name: Collect all release files
        run: |
          mkdir -p release-files
          # Copy archives, checksums, GPG signatures, and ML-DSA-65 signatures
          for dir in artifacts/release-*/; do
            cp "$dir"/*.tar.gz release-files/ 2>/dev/null || true
            cp "$dir"/*.zip release-files/ 2>/dev/null || true
            cp "$dir"/*.sha256 release-files/ 2>/dev/null || true
            cp "$dir"/*.asc release-files/ 2>/dev/null || true
            cp "$dir"/*.sig release-files/ 2>/dev/null || true
          done
          # Copy release manifest
          cp artifacts/manifest/release-manifest.json release-files/ 2>/dev/null || true
          cp artifacts/manifest/release-manifest.json.sig release-files/ 2>/dev/null || true
          cp artifacts/custody/release-custody.json release-files/
          # Copy SKILL.md artifacts
          cp SKILL.md release-files/
          cp SKILL.md.sig release-files/
          cp SAORSA_PUBLIC_KEY.asc release-files/
          cp .well-known/agent.json release-files/
          # The PUBLISHED asset must be inspected against the tag, not just
          # against the source tree (#514): pass the tag so a staged card
          # that drifted from the tagged release blocks the GitHub Release
          # step. --ref re-asserts that this run targets a valid release tag
          # before anything is published.
          python3 .github/scripts/validate_release_metadata.py \
            --mode release_tag --tag "${GITHUB_REF_NAME}" --ref "${GITHUB_REF}" \
            --agent-card release-files/agent.json
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          # A published release enters the daemon auto-update feed. Keep these
          # exact signed bytes private until the operator verifies the draft's
          # Linux archive on testnet and explicitly promotes this same draft.
          draft: true
          generate_release_notes: true
          body: |
            ## x0x ${{ github.ref_name }}

            **Agent-to-Agent Secure Communication Network**

            Post-quantum encrypted P2P gossip network for AI agents. Enable agents to discover each other, communicate securely, and collaborate on shared task lists without central servers.

            ### Binaries Included

            - **x0xd** — Agent daemon with REST API (default: `127.0.0.1:12700`)

            ### Installation

            **Rust:**
            ```bash
            cargo add x0x
            ```

            **Other languages:** x0x is daemon-only — run `x0xd` and consume the local REST/WebSocket API from any language. See [`docs/local-apps.md`](docs/local-apps.md) for examples.

            ### Platform Binaries

            | Platform | File | Code Signed |
            |----------|------|-------------|
            | Linux x64 (glibc) | `x0x-linux-x64-gnu.tar.gz` | ML-DSA-65 + GPG |
            | Linux x64 (musl/static) | `x0x-linux-x64-musl.tar.gz` | ML-DSA-65 + GPG |
            | Linux ARM64 | `x0x-linux-arm64-gnu.tar.gz` | ML-DSA-65 + GPG |
            | macOS x64 (Intel) | `x0x-macos-x64.tar.gz` | ML-DSA-65 + Apple + GPG |
            | macOS ARM64 (Apple Silicon) | `x0x-macos-arm64.tar.gz` | ML-DSA-65 + Apple + GPG |
            | Windows x64 | `x0x-windows-x64.zip` | ML-DSA-65 + GPG |

            All binaries are signed with ML-DSA-65 (post-quantum, `.sig` files) and GPG (`.asc` files). macOS binaries are additionally signed with Apple Developer ID and notarized.

            ### Verify GPG Signatures

            ```bash
            # Import Saorsa Labs public key
            gpg --import SAORSA_PUBLIC_KEY.asc

            # Verify any archive
            gpg --verify x0x-linux-x64-gnu.tar.gz.asc x0x-linux-x64-gnu.tar.gz

            # Verify SKILL.md
            gpg --verify SKILL.md.sig SKILL.md
            ```

            ### Verify SHA-256 Checksums

            ```bash
            sha256sum -c x0x-linux-x64-gnu.tar.gz.sha256
            ```

            ### SKILL.md (GPG-Signed)

