name: Integration & Soak Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3am UTC (soak)

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Guardian: API coverage enforcement (every PR, ~30s) ────────────────
  api-coverage:
    name: API Coverage Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Symlink dependencies
        run: |
          mkdir -p .deps
          git clone --depth 1 https://github.com/saorsa-labs/ant-quic .deps/ant-quic || true
          git clone --depth 1 https://github.com/saorsa-labs/saorsa-gossip .deps/saorsa-gossip || true
          ln -sf "$(pwd)/.deps/ant-quic" ../ant-quic
          ln -sf "$(pwd)/.deps/saorsa-gossip" ../saorsa-gossip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run guardian tests
        run: |
          cargo test --all-features --test api_coverage --no-run
          python3 scripts/ci/isolated-runtime.py cargo test --offline --locked --all-features --test api_coverage

  # ── Property tests (every PR, ~2min) ──────────────────────────────────
  proptest:
    name: Property Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Symlink dependencies
        run: |
          mkdir -p .deps
          git clone --depth 1 https://github.com/saorsa-labs/ant-quic .deps/ant-quic || true
          git clone --depth 1 https://github.com/saorsa-labs/saorsa-gossip .deps/saorsa-gossip || true
          ln -sf "$(pwd)/.deps/ant-quic" ../ant-quic
          ln -sf "$(pwd)/.deps/saorsa-gossip" ../saorsa-gossip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin: floating latest can silently change CI behaviour (refs #673)
      - name: Run property tests
        # Scope compilation to ONLY the targets that host property tests
        # (--lib + the eight tests/proptest_*.rs binaries) instead of the
        # whole workspace. The full-workspace build links ~72 debug binaries
        # in parallel, which OOM-kills the runner at ~4m45s; this caps it to
        # ~9 targets and is several times faster.
        #
        # The filter is binary-scoped on purpose: the tests/proptest_*.rs
        # suites name their test functions descriptively (e.g.
        # `blocked_overrides_all`), NOT `proptest_*`, so a name filter like
        # `test(/proptest/)` silently matched only the 2 proptest-named tests
        # in src/presence.rs and skipped all 58 integration-file property
        # tests. `test(/^proptest_/) | test(/proptest/)` is kept to pull in
        # those presence lib tests; the eight `binary(...)` clauses cover the
        # rest. (60 tests total vs the prior 2.)
        # --build-jobs 2: belt-and-braces cap on parallel linking, since each
        # proptest binary links the (large) x0x crate.
        run: |
          bash scripts/ci/nextest-isolated.sh --all-features --build-jobs 2 --lib \
            --test proptest_connectivity --test proptest_crdt --test proptest_files \
            --test proptest_groups --test proptest_kv --test proptest_mls \
            --test proptest_presence --test proptest_trust \
            -- -E 'binary(proptest_connectivity) | binary(proptest_crdt) | binary(proptest_files) | binary(proptest_groups) | binary(proptest_kv) | binary(proptest_mls) | binary(proptest_presence) | binary(proptest_trust) | test(/^proptest_/) | test(/proptest/)'

  # ── Integration tests — split into parallel jobs (issue #197) ──────────
  #    The old monolithic `integration` job ran ~10 suites sequentially
  #    under a single 20-min ceiling and was structurally canceled at the
  #    wall-clock limit on every PR, despite all tests passing. It is now
  #    four jobs: three run in parallel on every PR (core + groups + net),
  #    and the de-flaked timing suites run only on the weekly schedule
  #    (mirroring the soak job's gating). Each PR job retains its 20-min
  #    ceiling and all existing suites. Their root integration targets include
  #    tests/harness/src/{daemon,cluster}.rs, which prefer CARGO_BIN_EXE_x0xd:
  #    Cargo supplies the debug/all-features binary for nextest. Separate
  #    release prebuilds were unused and exhausted core's cold-cache budget
  #    before D4 completed (issue #522). Release builds remain in build.yml.
  #    --build-jobs 2 is intentionally omitted here: each nextest call
  #    targets a single test binary, so there's no parallel-linking OOM
  #    risk (unlike the proptest job, which links 8 binaries in one call).

  # Core: daemon API + D4 signed-commit suites (light load).
  integration-core:
    name: Integration (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X0X_RUNTIME_TIMEOUT_SECONDS: 1200
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Symlink dependencies
        run: |
          mkdir -p .deps
          git clone --depth 1 https://github.com/saorsa-labs/ant-quic .deps/ant-quic || true
          git clone --depth 1 https://github.com/saorsa-labs/saorsa-gossip .deps/saorsa-gossip || true
          ln -sf "$(pwd)/.deps/ant-quic" ../ant-quic
          ln -sf "$(pwd)/.deps/saorsa-gossip" ../saorsa-gossip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin: floating latest can silently change CI behaviour (refs #673)
      - name: Run daemon API integration tests
        run: bash scripts/ci/nextest-isolated.sh --all-features --test daemon_api_integration -- -- --ignored
      - name: Run named group D4 signed commit integration tests
        run: bash scripts/ci/nextest-isolated.sh --all-features --test named_group_d4_apply -- -- --ignored
      - name: Run bound-port forwarding regression
        run: bash scripts/ci/nextest-isolated.sh --all-features --lib -- --run-ignored ignored-only --no-tests=fail -E 'test(=forward::tests::port_zero_forwards_are_listed_and_removed_by_bound_address)'

  # Groups: the heavy named-group daemon suite (28 daemon-backed tests),
  # isolated on its own runner so it cannot stack on core's cold build.
  # See issue #197: core was cancelled at its budget when this suite rode
  # the same job as the release build on a cold rust-cache.
  integration-groups:
    name: Integration (groups)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X0X_RUNTIME_TIMEOUT_SECONDS: 1200
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Symlink dependencies
        run: |
          mkdir -p .deps
          git clone --depth 1 https://github.com/saorsa-labs/ant-quic .deps/ant-quic || true
          git clone --depth 1 https://github.com/saorsa-labs/saorsa-gossip .deps/saorsa-gossip || true
          ln -sf "$(pwd)/.deps/ant-quic" ../ant-quic
          ln -sf "$(pwd)/.deps/saorsa-gossip" ../saorsa-gossip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin: floating latest can silently change CI behaviour (refs #673)
      - name: 'Check issue #321 custody routing (inert)'
        run: python3 scripts/ci/test_issue321_custody_routing.py
      - name: Run named group integration tests
        run: bash scripts/ci/nextest-isolated.sh --all-features --test named_group_integration -- --run-ignored ignored-only
      # The existing isolated nextest invocation resolves Cargo.lock and warms
      # the locked dependency graph before this offline daemon build.
      - name: 'Build and pin x0xd for issue #321'
        run: |
          cargo build --offline --locked --all-features --bin x0xd
          test -x target/debug/x0xd
          sha256sum target/debug/x0xd
      # Each issue #321 selector gets its own RUNNER_TEMP subtree and typed
      # acceptance receipt. Use a task env name: Actions reserves RUNNER_TEMP,
      # so bind it at command invocation for the collector as the producer does.
      # The shared collector binds one test binary to one
      # build-custody scratch; combining binaries would make custody ambiguous.
      - name: 'Run issue #321 verified history restart acceptance'
        run: |
          set -euo pipefail
          test -x target/debug/x0xd
          root="$RUNNER_TEMP/issue321-history-restart"
          mkdir -p "$root"
          sha256sum target/debug/x0xd > "$root/x0xd.sha256"
          set +e
          X0X_ISOLATION_ROLE=acceptance RUNNER_TEMP="$root" \
            bash scripts/ci/nextest-isolated.sh --all-features \
              --test named_group_e_live -- \
              --run-ignored ignored-only \
              -E 'test(=e_verified_envelope_history_lookup_survives_restart)' \
              > "$root/command.log" 2>&1
          status=$?
          set -e
          cat "$root/command.log"
          printf '%s\n' "$status" > "$root/command.exit"
          exit "$status"
      - name: 'Collect issue #321 verified history custody'
        id: collect_issue321_history
        if: always()
        env:
          X0X_CUSTODY_ROOT: ${{ runner.temp }}/issue321-history-restart
          X0X_CUSTODY_EXPECT: success
          X0X_CUSTODY_MIN_RUNS: '1'
          X0X_CUSTODY_ROLES: acceptance
          X0X_CUSTODY_TARGET: named_group_e_live
        run: RUNNER_TEMP="$X0X_CUSTODY_ROOT" python3 scripts/ci/isolation-custody-collect.py "$X0X_CUSTODY_ROOT/safe"
      - name: 'Upload issue #321 verified history custody'
        if: always() && steps.collect_issue321_history.outputs.receipt_eligible == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: issue321-history-custody
          path: ${{ runner.temp }}/issue321-history-restart/safe/custody-receipt.json
          if-no-files-found: error

      - name: 'Run issue #321 direct canonical point lookup'
        if: always()
        run: |
          set -euo pipefail
          test -x target/debug/x0xd
          root="$RUNNER_TEMP/issue321-history-point"
          mkdir -p "$root"
          sha256sum target/debug/x0xd > "$root/x0xd.sha256"
          set +e
          X0X_ISOLATION_ROLE=acceptance RUNNER_TEMP="$root" \
            bash scripts/ci/nextest-isolated.sh --all-features \
              --test history_point_lookup_wiring -- \
              -E 'test(=history_message_point_lookup_serves_group_row_by_canonical_id)' \
              > "$root/command.log" 2>&1
          status=$?
          set -e
          cat "$root/command.log"
          printf '%s\n' "$status" > "$root/command.exit"
          exit "$status"
      - name: 'Collect issue #321 direct lookup custody'
        id: collect_issue321_point
        if: always()
        env:
          X0X_CUSTODY_ROOT: ${{ runner.temp }}/issue321-history-point
          X0X_CUSTODY_EXPECT: success
          X0X_CUSTODY_MIN_RUNS: '1'
          X0X_CUSTODY_ROLES: acceptance
          X0X_CUSTODY_TARGET: history_point_lookup_wiring
        run: RUNNER_TEMP="$X0X_CUSTODY_ROOT" python3 scripts/ci/isolation-custody-collect.py "$X0X_CUSTODY_ROOT/safe"
      - name: 'Upload issue #321 direct lookup custody'
        if: always() && steps.collect_issue321_point.outputs.receipt_eligible == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: issue321-history-point-custody
          path: ${{ runner.temp }}/issue321-history-point/safe/custody-receipt.json
          if-no-files-found: error

      - name: 'Run issue #321 delegation and cold-wake acceptance'
        if: always()
        run: |
          set -euo pipefail
          test -x target/debug/x0xd
          root="$RUNNER_TEMP/issue321-delegation"
          mkdir -p "$root"
          sha256sum target/debug/x0xd > "$root/x0xd.sha256"
          set +e
          X0X_ISOLATION_ROLE=acceptance RUNNER_TEMP="$root" \
            bash scripts/ci/nextest-isolated.sh --all-features \
              --test delegation_spaces -- \
              --run-ignored ignored-only \
              -E 'test(=delegation_survives_restart_via_history) | test(=delegation_carrier_verified_history_survives_receiver_restart) | test(=delegated_child_cold_wake_rehydrates_carrier_and_sends_as)' \
              > "$root/command.log" 2>&1
          status=$?
          set -e
          cat "$root/command.log"
          printf '%s\n' "$status" > "$root/command.exit"
          exit "$status"
      - name: 'Collect issue #321 delegation custody'
        id: collect_issue321_delegation
        if: always()
        env:
          X0X_CUSTODY_ROOT: ${{ runner.temp }}/issue321-delegation
          X0X_CUSTODY_EXPECT: success
          X0X_CUSTODY_MIN_RUNS: '1'
          X0X_CUSTODY_ROLES: acceptance
          X0X_CUSTODY_TARGET: delegation_spaces
        run: RUNNER_TEMP="$X0X_CUSTODY_ROOT" python3 scripts/ci/isolation-custody-collect.py "$X0X_CUSTODY_ROOT/safe"
      - name: 'Upload issue #321 delegation custody'
        if: always() && steps.collect_issue321_delegation.outputs.receipt_eligible == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: issue321-delegation-custody
          path: ${{ runner.temp }}/issue321-delegation/safe/custody-receipt.json
          if-no-files-found: error

      - name: 'Run issue #321 moderated transport control'
        if: always()
        run: |
          set -euo pipefail
          test -x target/debug/x0xd
          root="$RUNNER_TEMP/issue321-moderated"
          mkdir -p "$root"
          sha256sum target/debug/x0xd > "$root/x0xd.sha256"
          set +e
          X0X_ISOLATION_ROLE=acceptance RUNNER_TEMP="$root" \
            bash scripts/ci/nextest-isolated.sh --all-features \
              --test named_group_e_live -- \
              --run-ignored ignored-only \
              -E 'test(=e_moderated_public_positive_cross_daemon_receive)' \
              > "$root/command.log" 2>&1
          status=$?
          set -e
          cat "$root/command.log"
          printf '%s\n' "$status" > "$root/command.exit"
          exit "$status"
      - name: 'Collect issue #321 moderated custody'
        id: collect_issue321_moderated
        if: always()
        env:
          X0X_CUSTODY_ROOT: ${{ runner.temp }}/issue321-moderated
          X0X_CUSTODY_EXPECT: success
          X0X_CUSTODY_MIN_RUNS: '1'
          X0X_CUSTODY_ROLES: acceptance
          X0X_CUSTODY_TARGET: named_group_e_live
        run: RUNNER_TEMP="$X0X_CUSTODY_ROOT" python3 scripts/ci/isolation-custody-collect.py "$X0X_CUSTODY_ROOT/safe"
      - name: 'Upload issue #321 moderated custody'
        if: always() && steps.collect_issue321_moderated.outputs.receipt_eligible == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: issue321-moderated-custody
          path: ${{ runner.temp }}/issue321-moderated/safe/custody-receipt.json
          if-no-files-found: error

  # Issue #277 datagram-lane acceptance (ADR-0042 (c)). Loopback only:
  # every agent binds 127.0.0.1:0 and the lossy proxy binds 127.0.0.1:0,
  # so nothing in this job leaves the runner. Kept in its own job because
  # the phase oracles below assert EXACT jitter counter deltas and need a
  # lossless clean lane; sharing a runner with a heavy suite would turn a
  # scheduling stall into a false counter mismatch.
  integration-voice-datagram:
    name: 'Integration (voice datagram, #277)'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      X0X_RUNTIME_TIMEOUT_SECONDS: 1200
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Symlink dependencies
        run: |
          mkdir -p .deps
          git clone --depth 1 https://github.com/saorsa-labs/ant-quic .deps/ant-quic || true
          git clone --depth 1 https://github.com/saorsa-labs/saorsa-gossip .deps/saorsa-gossip || true
          ln -sf "$(pwd)/.deps/ant-quic" ../ant-quic
          ln -sf "$(pwd)/.deps/saorsa-gossip" ../saorsa-gossip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin: floating latest can silently change CI behaviour (refs #673)
      # Pin the bytes before any runtime: build the suite without
      # executing it, so discovery below reuses binaries that already
      # exist rather than compiling inside the namespace.
      - name: Build the acceptance suite (no execution)
        run: cargo test --all-features --test voice_datagram_e2e --no-run
      # Selection proof, structured. This suite is entirely `#[ignore]`d,
      # so a plain `cargo test` reports it green without executing a
      # single test, and a missing `required-features` entry compiles the
      # file away to an empty, passing binary. Both are invisible in
      # human-readable output, so this asserts nextest's JSON list: real
      # test names, and the `ignored` flag that decides whether
      # `--run-ignored ignored-only` selects them at all. Runs inside the
      # issue #417 namespace so discovery executes the test binaries on
      # `lo` only, never on the host network.
      - name: 'Assert acceptance selection (structured nextest JSON)'
        env:
          X0X_ISOLATION_ROLE: selection
        run: python3 scripts/ci/isolated-runtime.py python3 scripts/ci/voice-datagram-selection.py
      # Acceptance itself goes through the reviewed wrapper: cargo
      # metadata resolved once, binaries-only build with no discovery
      # execution outside isolation, `nextest-reuse.py record` pinning
      # every binary hash plus Cargo.lock and the HEAD/tree SHAs, then
      # `run` re-verifying that custody inside the issue #417 namespace
      # before a single test executes.
      - name: 'Run issue #277 datagram-lane acceptance'
        env:
          X0X_ISOLATION_ROLE: acceptance
        run: |
          bash scripts/ci/nextest-isolated.sh --all-features \
            --test voice_datagram_e2e -- \
            --run-ignored ignored-only \
            --test-threads 1
      # Retention. The wrapper chain writes its admission, teardown and
      # build-custody receipts into $RUNNER_TEMP, which dies with the runner,
      # so without this the only reviewable evidence is the free-text job log.
      # The collector reads a fixed allowlist of those generated files and
      # emits a fixed allowlist of fields: no argv, no environment, no
      # absolute paths, no product output. It runs on failure too, so the
      # namespace teardown receipt survives a failed acceptance step, and it
      # exits non-zero when the job otherwise succeeded but a receipt is
      # missing or inconsistent — a green test run cannot be reported without
      # its custody. Min 2 runs: the selection proof and the acceptance run
      # are each separately admitted.
      - name: 'Collect issue #417 isolation custody'
        id: collect_custody
        if: always()
        env:
          X0X_CUSTODY_EXPECT: ${{ job.status }}
          X0X_CUSTODY_MIN_RUNS: '2'
          X0X_CUSTODY_ROLES: selection,acceptance
          X0X_CUSTODY_TARGET: voice_datagram_e2e
        run: python3 scripts/ci/isolation-custody-collect.py "$RUNNER_TEMP/x0x-custody-receipt"
      - name: 'Upload issue #417 isolation custody receipt'
        if: always() && steps.collect_custody.outputs.receipt_eligible == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: voice-datagram-isolation-custody
          path: ${{ runner.temp }}/x0x-custody-receipt/custody-receipt.json
          if-no-files-found: error

  # Net: GUI smoke + WebSocket + kv bootstrap + local-topic routing.
  integration-net:
    name: Integration (net)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X0X_RUNTIME_TIMEOUT_SECONDS: 1200
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Symlink dependencies
        run: |
          mkdir -p .deps
          git clone --depth 1 https://github.com/saorsa-labs/ant-quic .deps/ant-quic || true
          git clone --depth 1 https://github.com/saorsa-labs/saorsa-gossip .deps/saorsa-gossip || true
          ln -sf "$(pwd)/.deps/ant-quic" ../ant-quic
          ln -sf "$(pwd)/.deps/saorsa-gossip" ../saorsa-gossip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin: floating latest can silently change CI behaviour (refs #673)
      - name: Run GUI smoke tests
        run: bash scripts/ci/nextest-isolated.sh --all-features --test gui_smoke --
      - name: Run WebSocket tests
        run: bash scripts/ci/nextest-isolated.sh --all-features --test ws_integration -- -- --ignored
      - name: Run KvStore first-join bootstrap tests (issue 96)
        run: bash scripts/ci/nextest-isolated.sh --all-features --test kv_first_join_bootstrap -- --test-threads 1 -- --ignored
      - name: Run local-topic routing tests (issue 89)
        run: bash scripts/ci/nextest-isolated.sh --all-features --test local_topics -- --test-threads 1 -- --ignored

  # ── De-flaked timing suites moved off the PR path (issue #197).
  #    These are convergence/jitter-prone budgets (the join-metadata suite
  #    alone is ~20-25 s ×7 ≈ 3 min) that previously inflated the
  #    monolithic integration job past its 20-min PR ceiling. Coverage is
  #    preserved by running them on the weekly schedule, mirroring the
  #    soak job's `if: github.event_name == 'schedule'` gating. None is a
  #    required status check, so this stays advisory.
  integration-timing:
    name: Integration Timing Suites (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      X0X_RUNTIME_TIMEOUT_SECONDS: 1800
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Symlink dependencies
        run: |
          mkdir -p .deps
          git clone --depth 1 https://github.com/saorsa-labs/ant-quic .deps/ant-quic || true
          git clone --depth 1 https://github.com/saorsa-labs/saorsa-gossip .deps/saorsa-gossip || true
          ln -sf "$(pwd)/.deps/ant-quic" ../ant-quic
          ln -sf "$(pwd)/.deps/saorsa-gossip" ../saorsa-gossip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin: floating latest can silently change CI behaviour (refs #673)
      - name: Build release binaries (shared across suites)
        run: cargo build --release --bin x0xd --bin x0x
      - name: Run peer-lifecycle daemon tests (de-flaked, ignored-only)
        run: bash scripts/ci/nextest-isolated.sh --all-features --test peer_lifecycle_integration -- --run-ignored ignored-only
      - name: Run x0x_0041 reissue timing test (de-flaked, ignored-only)
        run: bash scripts/ci/nextest-isolated.sh --all-features --test x0x_0041_prefer_newest_test -- --run-ignored ignored-only
      - name: Run named-group join-metadata convergence tests (de-flaked, ignored-only)
        run: bash scripts/ci/nextest-isolated.sh --all-features --test named_group_join_metadata_event -- --run-ignored ignored-only

  # ── Soak test (weekly, ~90min) ────────────────────────────────────────
  soak:
    name: Soak Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      X0X_RUNTIME_TIMEOUT_SECONDS: 5400
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Symlink dependencies
        run: |
          mkdir -p .deps
          git clone --depth 1 https://github.com/saorsa-labs/ant-quic .deps/ant-quic || true
          git clone --depth 1 https://github.com/saorsa-labs/saorsa-gossip .deps/saorsa-gossip || true
          ln -sf "$(pwd)/.deps/ant-quic" ../ant-quic
          ln -sf "$(pwd)/.deps/saorsa-gossip" ../saorsa-gossip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: grafana/setup-k6-action@v1
      - name: Build release binaries
        run: cargo build --release --bin x0xd
      - name: Run 1-hour soak
        run: python3 scripts/ci/isolated-runtime.py bash tests/soak/run_soak.sh --duration 1h
      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: soak-results
          path: tests/soak/results/
