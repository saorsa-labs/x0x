            --no-tests=fail \
            --test-threads 1 \
            -E 'test(=public_pubsub_key_cache_full_ref_restart_recovery)'
      - name: Collect isolation and build custody
        id: collect_key_cache_custody
        if: always()
        env:
          X0X_CUSTODY_EXPECT: ${{ job.status }}
          X0X_CUSTODY_MIN_RUNS: '1'
          X0X_CUSTODY_ROLES: acceptance
          X0X_CUSTODY_TARGET: gossip_key_cache_transport
        run: >-
          python3 scripts/ci/isolation-custody-collect.py
          "$RUNNER_TEMP/x0x-custody-receipt"
      - name: Upload isolation custody receipt
        if: always() && steps.collect_key_cache_custody.outputs.receipt_eligible == 'true'
