# #449 isolated runtime acceptance — MANUAL ONLY.
#
# Never triggers on push, pull_request or schedule. Execution requires an
# explicit workflow_dispatch by an authorized operator with the exact expected
# commit. Root authorization precedes any dispatch.
#
# Uploads the ALLOWLISTED receipt and the unchanged wrapper's own isolation
# receipts ONLY. Daemon logs stay inside the private tmpfs namespace and are
# destroyed with it; they are never collected.
name: 449 home restart acceptance (manual)

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact commit SHA this run must be executing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: 449-home-restart-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Pinned toolchain, matching the #535 diagnostic.
      RUST_VERSION: 1.95.0
      # Exact bytes of the harness and the UNCHANGED #535 wrapper.
      HARNESS_SHA256: 9b5c45e2968315b878e84bdf18d1f3c3b41753570b1e6fa5a861bbb2d3bbd1e9
      WRAPPER_SHA256: 2a0c2521c19d5054b6e77c995e1604e9e9e174208157bb4331b5b38783aedced
      WITNESS_SHA256: dbd753e24b3d082ed434813e575ed214aa70fd8d33b8872f70db1bedb5e0f5ec
      # Well under the wrapper's own 21600s ceiling.
      X0X_RUNTIME_TIMEOUT_SECONDS: "900"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false

      - name: Assert exact HEAD and clean checkout
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          [ "$head" = "${{ inputs.expected_head }}" ] || {
            echo "HEAD $head != expected ${{ inputs.expected_head }}"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "dirty checkout"; exit 1; }
          echo "head=$head"
          echo "tree=$(git rev-parse 'HEAD^{tree}')"

      - name: Pin harness and unchanged wrapper bytes
        run: |
          set -euo pipefail
          check() { echo "$2  $1" | sha256sum -c - ; }
          check scripts/diagnostics/449-home-restart-acceptance.py "$HARNESS_SHA256"
          check scripts/ci/isolated-runtime.py "$WRAPPER_SHA256"
          check scripts/ci/isolation-witness.py "$WITNESS_SHA256"

      - name: Pure controls (no daemon, no network)
        run: python3 scripts/diagnostics/449-home-restart-acceptance.py --self-test

      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc -V
          cargo -V

      - name: Build binaries with a locked, retained resolution
        run: |
          set -euo pipefail
          # Cargo.lock is gitignored, so resolution is NOT reproducible from the
          # tree. Resolve once, record it, then require --locked to prove the
          # build consumed exactly that resolution.
          cargo generate-lockfile
          sha256sum Cargo.lock | tee lock-before.txt
          cargo build --locked --release --bin x0xd --bin x0x
          sha256sum Cargo.lock | tee lock-after.txt
          diff lock-before.txt lock-after.txt || { echo "lock drifted"; exit 1; }
          sha256sum target/release/x0xd target/release/x0x | tee binaries.sha256

      - name: Isolated runtime acceptance (unchanged #535 wrapper is the boundary)
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 scripts/ci/isolated-runtime.py \
            python3 scripts/diagnostics/449-home-restart-acceptance.py \
              --binary "$PWD/target/release/x0xd" \
              --cli    "$PWD/target/release/x0x" \
              --evidence "$RUNNER_TEMP/449-evidence"

      - name: Assert wrapper isolation and cancellation receipts
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=("${RUNNER_TEMP:-${{ runner.temp }}}"/x0x-isolation-*)
          [ ${#dirs[@]} -eq 1 ] || { echo "expected exactly one isolation dir"; exit 1; }
          d="${dirs[0]}"
          for f in admission.json exit.json supervisor.json; do
            [ -f "$d/$f" ] || { echo "missing wrapper receipt $f"; exit 1; }
          done
          # The wrapper proves the namespace: loopback only, no default route.
          python3 - "$d" <<'PY'
          import json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          adm = json.loads((d / 'admission.json').read_text())
          assert [l['ifname'] for l in adm['links']] == ['lo'], adm['links']
          for rows in adm['routes'].values():
              for row in rows:
                  assert row.get('dev') == 'lo' and row.get('dst') != 'default', row
          sup = json.loads((d / 'supervisor.json').read_text())
          assert sup['child_reaped'] is True, sup
          assert sup['reason'] is None, f"run was cancelled: {sup['reason']}"
          print('isolation receipts ok')
          PY

      - name: Collect allowlisted receipts only
        if: always()
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-${{ runner.temp }}}/449-upload"
          mkdir -p "$out"
          cp "${RUNNER_TEMP:-${{ runner.temp }}}/449-evidence/449-acceptance.json" "$out/" || true
          for f in admission.json exit.json supervisor.json; do
            cp "${RUNNER_TEMP:-${{ runner.temp }}}"/x0x-isolation-*/"$f" "$out/" || true
          done
          cp lock-before.txt binaries.sha256 "$out/" || true
          # Explicit refusal: no daemon logs, no data roots, no sidecars.
          find "$out" -type f -print

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 449-acceptance-receipts
          path: ${{ runner.temp }}/449-upload
          if-no-files-found: error
          retention-days: 7
