name: "1135 rate probe"

# TEMPORARY measurement-only workflow for issue #1135: run the single
# asymmetric-convergence test 50x to estimate the flake rate on a
# standard runner. This branch/PR is closed after recording the rate.
on:
  push:
    branches: [test/1135-rate-probe]
  pull_request:
    branches: [main]

jobs:
  rate-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: 1135-probe-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run the single test 50x
        run: |
          cargo nextest run -E 'test(asymmetric_signed_capability_convergence_over_relay)' \
            --run-count 50 --retries 0 --no-fail-fast
      - name: Summary
        if: always()
        run: echo "50x run complete; see the test step's pass/fail counts above"
