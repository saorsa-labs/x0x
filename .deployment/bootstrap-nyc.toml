# x0x Node Configuration - NYC (saorsa-2)
# Location: New York City, US (DigitalOcean)
# Public IPv4: 142.93.199.50
# Public IPv6: 2604:a880:400:d1:0:3:7db3:f001

# QUIC transport bind address (dual-stack: accepts both IPv4 and IPv6)
bind_address = "[::]:5483"

# Health/metrics endpoint (localhost only)
health_address = "127.0.0.1:12600"

# Machine identity key
machine_key_path = "/var/lib/x0x/machine.key"

# Data directory
data_dir = "/var/lib/x0x/data"

# Bootstrap roles
coordinator = true
reflector = true
relay = true

# Known peers (other 3 bootstrap nodes — IPv4 addresses for cross-node connectivity)
known_peers = [
    "147.182.234.192:5483",    # saorsa-3 (SFO)
    "152.42.210.67:5483",      # saorsa-8 (Singapore, DigitalOcean)
    "170.64.176.102:5483",     # saorsa-9 (Sydney, DigitalOcean)
]

# Logging
log_level = "info"

# Self-update configuration
[update]
enabled = true
check_interval_seconds = 3600
rollout_window_minutes = 120
stop_on_upgrade = true
repo = "saorsa-labs/x0x"
