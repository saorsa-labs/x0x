# Issue #456: the workspace suite must never write Home-Suite state into a
# developer's real ~/.x0x (owner-cert journal, agent.cert, move/placement
# files, history.db, contacts). nextest has no config-level env table, so
# every test process runs through an `env` wrapper that pins
# X0X_HOME (honoured by the storage default-dir resolver) and HOME (the
# backstop for any site not yet routed through the resolver) to a scratch
# directory. To debug against a different location, change it here.
#
# Review r2fix (PR #465 CI abort): RUST_MIN_STACK=16MiB gives the libtest
# worker threads real headroom. The deep async fixtures (the shared
# secure_endpoint_test_state machine nests the whole Agent builder future)
# sit just past the 2 MiB std default on x86_64 debug builds — the suite
# crashed there with SIGABRT stack overflows. The memory is reserved, not
# committed, so the cost is negligible.
experimental = ["wrapper-scripts"]

[scripts.wrapper.x0x-test-home]
command = 'env RUST_MIN_STACK=16777216 X0X_HOME=/tmp/x0x-nextest-home HOME=/tmp/x0x-nextest-home'

[[profile.default.scripts]]
filter = 'all()'
run-wrapper = 'x0x-test-home'

# W3-H (#1164) simulation harness. `--profile w3h` runs only `w3h_` tests,
# each with the Linux entropy/wall-clock shim preloaded (build it first:
# `just w3h-shim`) and its canonical trace written under target/w3h/traces.
# The shim stays inert unless W3H_SHIM_ACTIVE=1 and W3H_ENTROPY_SEED are set,
# which only this wrapper does.
# Recipes/CI pass `--run-ignored all` so LD_PRELOAD-only unit tests declared
# `#[ignore]` (ADR 0025 §3–4) actually execute their assertions here and are
# not silent passes under the default Test Suite / Coverage jobs.
# The `W3-H harness` CI job runs the `w3h-gate` profile with `--stress-count
# 20`, and `scripts/ci/w3h-trace-check.py` requires the same verdict with
# complete receipts in every rerun (D196); distinct traces are reported.
[scripts.wrapper.w3h-sim]
command = 'env RUST_MIN_STACK=16777216 X0X_HOME=/tmp/x0x-nextest-home HOME=/tmp/x0x-nextest-home LD_PRELOAD=target/w3h/libw3h_shim.so W3H_SHIM_ACTIVE=1 W3H_ENTROPY_SEED=0x1164 W3H_TRACE_DIR=target/w3h/traces'

[[profile.w3h.scripts]]
filter = 'all()'
run-wrapper = 'w3h-sim'

[profile.w3h]
default-filter = 'test(/(^|::)w3h_/)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The H-S3-c/c2 rows: see the `w3h-gate` override below.
[[profile.w3h.overrides]]
filter = 'test(/(^|::)w3h_1356_red_s3_c2?_(promoted_admin_reseats_owner_axis_node|reseat_retires_marker_and_gap)$/)'
slow-timeout = { period = "60s", terminate-after = 15 }
priority = 60

# The H-S3-s64 row: see the `w3h-gate` override below.
[[profile.w3h.overrides]]
filter = 'test(/(^|::)w3h_1356_control_s3_s64_segment_boundary$/)'
slow-timeout = { period = "60s", terminate-after = 10 }
priority = 55

# The CI `W3-H harness` gate job only: the same as `w3h`, plus raw payload
# dumps (`<case>-<pid>.payloads`, test identities only; the first run of
# each case and the first run whose digest differs from it) next to the
# traces, and the output of passing tests (`W3H-TRACE`, `W3H-ENTROPY`,
# receipts) in the log. No other job or recipe uses this profile.
[scripts.wrapper.w3h-sim-dump]
command = 'env RUST_MIN_STACK=16777216 X0X_HOME=/tmp/x0x-nextest-home HOME=/tmp/x0x-nextest-home LD_PRELOAD=target/w3h/libw3h_shim.so W3H_SHIM_ACTIVE=1 W3H_ENTROPY_SEED=0x1164 W3H_TRACE_DIR=target/w3h/traces W3H_DUMP_PAYLOADS=1'

[[profile.w3h-gate.scripts]]
filter = 'all()'
run-wrapper = 'w3h-sim-dump'

[profile.w3h-gate]
default-filter = 'test(/(^|::)w3h_/)'
slow-timeout = { period = "60s", terminate-after = 5 }
success-output = "final"

# ADR 0109 H-S3-c/c2 (#1689): each row runs a 30-minute virtual advance and
# a re-seat on four nodes, 255-600 s of wall time per run (more on the
# 4-vCPU runner). The 300 s kill above would end them with no receipt, so
# these two rows alone get 15 minutes. The stress count stays 20. They
# start first in each rerun, like the long cases below.
[[profile.w3h-gate.overrides]]
filter = 'test(/(^|::)w3h_1356_red_s3_c2?_(promoted_admin_reseats_owner_axis_node|reseat_retires_marker_and_gap)$/)'
slow-timeout = { period = "60s", terminate-after = 15 }
priority = 60

# ADR 0109 H-S3-s64 (#1572): three S0 groups, each with 63 to 65
# renames and a join result of about 800 KB, about 135 s of wall time per
# run locally. The 300 s kill above leaves no margin on the 4-vCPU runner,
# so this row gets 10 minutes and starts early in each rerun.
[[profile.w3h-gate.overrides]]
filter = 'test(/(^|::)w3h_1356_control_s3_s64_segment_boundary$/)'
slow-timeout = { period = "60s", terminate-after = 10 }
priority = 55

# Start the longest sims first in each rerun. In list order the 83 s
# #1427 catch-up case waited for the 1023 sims (about 145 s each on the
# 4-vCPU runner), so one rerun took about 226 s and 20 reruns used 86 of
# the job's 90 minutes (run 39484483102). Order only; verdicts unchanged.
[[profile.w3h-gate.overrides]]
filter = 'test(/(^|::)w3h_1023_(red_baseline|control_holders_never_return|control_holder_returns_recovers|restart_one_holder)/) | test(/(^|::)w3h_1427_catchup_/)'
priority = 50

# W3-H S3: the #1143 cases with creator and admin identities permuted (ADR
# 0108 s2_home_anonymous_owner_offline: "repeat with creator/admin
# identities permuted"). `W3H_IDENTITY_ORDER` names the case's labels from
# the lowest agent id to the highest; `Sim::empty` assigns the pre-generated
# keys sorted that way and marks the order in the trace. Each order writes
# to its own trace dir, so its receipts are gated on their own (`just
# test-w3h-permuted`). The positive control stays unpermuted.
[scripts.wrapper.w3h-sim-creator-low]
command = 'env RUST_MIN_STACK=16777216 X0X_HOME=/tmp/x0x-nextest-home HOME=/tmp/x0x-nextest-home LD_PRELOAD=target/w3h/libw3h_shim.so W3H_SHIM_ACTIVE=1 W3H_ENTROPY_SEED=0x1164 W3H_TRACE_DIR=target/w3h/traces-creator-low W3H_IDENTITY_ORDER=O,X,A,J'

[[profile.w3h-permuted-creator-low.scripts]]
filter = 'all()'
run-wrapper = 'w3h-sim-creator-low'

[profile.w3h-permuted-creator-low]
default-filter = 'test(/(^|::)w3h_1143_/) and not test(/positive_control/)'
slow-timeout = { period = "60s", terminate-after = 5 }

[scripts.wrapper.w3h-sim-admin-low]
command = 'env RUST_MIN_STACK=16777216 X0X_HOME=/tmp/x0x-nextest-home HOME=/tmp/x0x-nextest-home LD_PRELOAD=target/w3h/libw3h_shim.so W3H_SHIM_ACTIVE=1 W3H_ENTROPY_SEED=0x1164 W3H_TRACE_DIR=target/w3h/traces-admin-low W3H_IDENTITY_ORDER=A,X,O,J'

[[profile.w3h-permuted-admin-low.scripts]]
filter = 'all()'
run-wrapper = 'w3h-sim-admin-low'

[profile.w3h-permuted-admin-low]
default-filter = 'test(/(^|::)w3h_1143_/) and not test(/positive_control/)'
slow-timeout = { period = "60s", terminate-after = 5 }
[profile.default]
# Network integration tests need longer timeouts for QUIC handshakes
# and gossip propagation on macOS
slow-timeout = { period = "60s", terminate-after = 10 }

# ADR 0109 H-S3-c/c2 (#1689): the same two rows as the `w3h` overrides
# above. A GREEN run does the full 30-minute virtual advance and re-seat.
# On 27ac757 the Test Suite killed both at the 600 s limit (CI run
# 40864998747); one local run takes 180-260 s. These two rows alone get
# 15 minutes here too, and start first.
[[profile.default.overrides]]
filter = 'test(/(^|::)w3h_1356_red_s3_c2?_(promoted_admin_reseats_owner_axis_node|reseat_retires_marker_and_gap)$/)'
slow-timeout = { period = "60s", terminate-after = 15 }
priority = 60

# Tests that create multiple QUIC endpoints on localhost must not run
# concurrently on macOS — ant-quic's dual-stack socket handling causes
# intermittent connection failures and hangs when many endpoints share
# the loopback interface. Serialise them via a shared test group.
[test-groups.quic-localhost]
max-threads = 1

[[profile.default.overrides]]
filter = "test(mesh_connections) | test(/^test_local_/)"
test-group = "quic-localhost"

[[profile.default.overrides]]
filter = "test(/^d4_/) | test(/^c2_/) | test(/^e_/)"
test-group = "quic-localhost"

[[profile.default.overrides]]
filter = "binary(named_group_join_metadata_event) | binary(named_group_integration)"
test-group = "quic-localhost"

# Issue #1283: the groups job's issue #321 acceptance selector runs three
# daemon-mesh tests from this binary in one nextest invocation, and nextest
# runs each test as its own process — the in-process suite_lock cannot
# serialise them. All three pairs then form simultaneously inside the one
# loopback-only network namespace the isolated runtime grants the invocation
# (six daemons sharing one loopback interface and one ephemeral port range),
# which is the sharing this group exists to prevent: both #1283 failures in
# run 37898362740 were concurrent members of that selector. The ambient-load
# attribution is unverified (#702). Not retries, not wider deadlines
# (ADR 0025 — a flake is not an observation).
[[profile.default.overrides]]
filter = "binary(delegation_spaces)"
test-group = "quic-localhost"

[[profile.default.overrides]]
filter = "binary(threading_integration)"
test-group = "quic-localhost"

[[profile.default.overrides]]
filter = "binary(f2_public_group_bootstrap_wiring) | binary(history_point_lookup_wiring)"
test-group = "quic-localhost"

# Issue #316: these two loopback tests failed a full parallel run and
# passed in isolation. Serial-group placement alone was not enough, so
# they also reserve scheduler slots via threads-required. The ambient-load
# attribution is unverified (#702). Not retries, not wider deadlines
# (ADR 0025 — a flake is not an observation).
[[profile.default.overrides]]
filter = "test(direct_send_with_require_ack_round_trips_to_live_peer) | test(=tests::suppressed_peer_inbound_redial_is_rejected)"
test-group = "quic-localhost"
threads-required = 4

# Coverage Gate on 13df90fc refused this one loopback selector in 0.441s
# (`recovery-response admission refused`) and the same selector passed when
# run alone. The fixture admission is true in both phases. The seam's
# non-blocking reads refuse on contention and report that same string.
# Group placement plus a scheduler reservation keeps this selector off the
# parallel coverage pile. Admission checks, the refusal siblings, and the
# exactly-once counts stay as they are. This is not a retry and not a
# wider deadline.
[[profile.default.overrides]]
filter = "test(s8a_r5_g13_real_pinned_exchange_is_admitted_once_and_delivered_once)"
test-group = "quic-localhost"
threads-required = 4

# ADR 0030 slice 3: gossip_plane_isolation was already in the serial group
# (see the block below) and still failed a full-parallel run, at the first
# `connect_addr`, in 2.4 s versus its normal ~12.4 s, with every dial
# strategy timing out. Four of four runs passed in isolation. Group
# placement bounds group-internal contention. This override reserves a
# scheduler slot, as the two #316 tests do. The ambient-load attribution
# is unverified (#702).
#
# This block MUST stay ahead of the broader one below: nextest applies the
# FIRST matching override, so appending these settings after that block
# would silently do nothing. Keeping the binary filtered separately also
# leaves the three slice-1 tests below on their existing settings rather
# than handing them reservations they have not been shown to need.
[[profile.default.overrides]]
filter = "binary(gossip_plane_isolation)"
test-group = "quic-localhost"
threads-required = 4

# The slice-1 regression tests each stand up multiple loopback QUIC
# endpoints; unserialized they add enough contention to break the
# gossip_plane_isolation stay-down window (2-of-2 full-run repro, green
# with these excluded, green on the v0.37.1 baseline). The plane-isolation
# binary itself is multi-endpoint loopback and belongs in the group too
# (now via the more specific override above, which matches it first).
[[profile.default.overrides]]
filter = "test(discovered_but_disconnected_peer_is_dialed_by_same_send) | test(identity_epoch_converges_with_linear_application_publishes) | test(non_treekem_self_leave_directly_delivers_member_removed_to_retained_owner) | binary(gossip_plane_isolation)"
test-group = "quic-localhost"

# Issue #510: cap concurrent execution of the deadline-carrying membership
# cluster tests at two. This bounds their overlap with one another while
# leaving unrelated suite tests eligible to run concurrently. Deadlines,
# assertions and test selection remain unchanged. This resource limit does
# not establish the cause of a convergence timeout. The ambient-load
# attribution is unverified (#702).
[test-groups.membership-cluster]
max-threads = 2

[[profile.default.overrides]]
filter = "test(hs_f2_membership_cluster) | test(issue506_public_broadcast_control)"
test-group = "membership-cluster"

# #501: real multi-peer controls share the existing localhost serialization.
[[profile.default.overrides]]
filter = "test(legacy_bus_interop_tests::)"
test-group = "quic-localhost"

# Pinned v0.47.0 file interop builds that daemon on a cache miss, then
# runs two loopback daemons. The first match wins, so this stays specific.
[[profile.default.overrides]]
filter = "test(=v047_pinned_peer_stores_accepts_and_rejects_both_ways)"
test-group = "quic-localhost"
slow-timeout = { period = "120s", terminate-after = 8 }

# ADR 0109 H-S3-home released-binary gate (#1571). The tests are
# `#[ignore]` and run only in the `h-s3-home-released` CI job with
# `--run-ignored ignored-only`. scripts/ci/prepare-released-h-s3-home.sh
# installs the pinned v0.45.0 and v0.46.1 daemons first. There is one test
# per released binary. Each test runs its three variants in parallel, and
# each variant does two 150 s real-time waits, so one test can take about
# 15 minutes. The limit is 25 minutes per test. The group keeps these
# daemons off the shared loopback group; the two tests can run together.
[[profile.default.overrides]]
filter = "binary(h_s3_home_released)"
test-group = "h-s3-home-released"
slow-timeout = { period = "60s", terminate-after = 25 }

[test-groups.h-s3-home-released]
max-threads = 2

# The #1614 pair test (ADR 0083, issue #1593) stands up two loopback
# daemons, and after its readiness loop saw every show gate true, the
# 10 s result deadline was still missed in full-parallel runs: run
# 40171754003 reported `unconfirmed` after 11.3 s in both the Test
# Suite and the Coverage Gate, and run 40173660640 (an unrelated
# branch) returned `refused` / target_needs_upgrade in 1.2 s when the
# capability verdict moved between readiness and dispatch. The same
# head passed its Test Suite in runs 40161481685, 40170405745 and
# 40501044013. The pair is the multi-endpoint loopback shape this
# group exists to serialise (#316, #1283). Group placement plus a
# scheduler reservation keeps it off the parallel pile in both jobs.
# The ambient-load attribution is unverified (#702). Not retries, not
# wider deadlines (ADR 0025 — a flake is not an observation).
[[profile.default.overrides]]
filter = "test(remote_show_opens_on_the_other_owner_daemon)"
test-group = "quic-localhost"
threads-required = 4
